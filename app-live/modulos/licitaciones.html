<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<script src="../js/auth.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Licitaciones — Centro de Control · Grupo Friopacking</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">

<style>
:root{
  --navy:#0f1e35; --brand:#0ea5a4; --brand2:#0b8786; --t2:#475569; --t3:#94a3b8;
  --bd:#e5e9f0; --bg:#f5f7fa; --surf:#fff; --ok:#15803d; --okbg:#ecfdf3; --warn:#b45309; --warnbg:#fff7ed; --bad:#b91c1c; --badbg:#fef2f2;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Manrope,system-ui,sans-serif;background:var(--bg);color:var(--navy);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:22px 20px 60px}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace}
.h1{font-size:22px;font-weight:800;letter-spacing:-.01em}
.sub{color:var(--t2);font-size:13px}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.btn{border:1px solid var(--bd);background:#fff;color:var(--navy);font-weight:700;font-size:13px;padding:8px 13px;border-radius:9px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:#cbd5e1;background:#f8fafc}
.btn:disabled{opacity:.5;cursor:default}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}.btn.pri:hover{background:var(--brand2)}
.btn.bad{color:var(--bad)}.btn.sm{padding:5px 10px;font-size:12px}
.btn.ghost{border-color:transparent;background:transparent;color:var(--t2)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tab{border:1px solid var(--bd);background:#fff;border-radius:999px;padding:7px 13px;font-weight:700;font-size:13px;cursor:pointer;color:var(--t2);display:flex;gap:7px;align-items:center}
.tab b{background:#eef2f7;color:var(--navy);border-radius:999px;padding:0 7px;font-size:12px}
.tab.on{background:var(--navy);border-color:var(--navy);color:#fff}.tab.on b{background:rgba(255,255,255,.18);color:#fff}
.search{border:1px solid var(--bd);border-radius:9px;padding:8px 12px;background:#fff;min-width:240px}
.card{background:var(--surf);border:1px solid var(--bd);border-radius:14px;padding:16px 18px;margin-bottom:14px}
.card h3{font-size:14px;font-weight:800;margin-bottom:4px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.hint{color:var(--t3);font-size:12.5px;margin-bottom:10px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--t3);font-weight:800;padding:8px 10px;border-bottom:1px solid var(--bd);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid #f1f4f8;vertical-align:top}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.row{cursor:pointer}tr.row:hover td{background:#f8fafc}
.tw{overflow-x:auto;border:1px solid var(--bd);border-radius:12px;background:#fff}
.pill{display:inline-block;font-size:11.5px;font-weight:800;padding:3px 9px;border-radius:999px;white-space:nowrap;background:#eef2f7;color:var(--t2)}
.p-apr{background:#fef3c7;color:#92400e}.p-open{background:#e0f2fe;color:#075985}.p-eval{background:#ede9fe;color:#5b21b6}
.p-ok{background:var(--okbg);color:var(--ok)}.p-bad{background:var(--badbg);color:var(--bad)}.p-prep{background:#f1f5f9;color:#475569}
.empty{text-align:center;color:var(--t3);padding:34px 12px;font-weight:600}
.back{margin-bottom:12px}
.head{background:var(--navy);color:#fff;border-radius:16px;padding:18px 20px;margin-bottom:14px}
.head .cod{font-family:'JetBrains Mono',monospace;font-size:12px;opacity:.7}
.head .nm{font-size:20px;font-weight:800;margin:2px 0 6px}
.head .meta{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;opacity:.85}
.head .pill{background:rgba(255,255,255,.15);color:#fff}
.steps{display:flex;gap:6px;margin-top:14px;flex-wrap:wrap}
.step{flex:1;min-width:120px;border-radius:10px;padding:7px 10px;font-size:12px;font-weight:700;background:rgba(255,255,255,.08);color:rgba(255,255,255,.55)}
.step.done{color:#a7f3d0}.step.cur{background:#fff;color:var(--navy)}
.step small{display:block;font-weight:600;opacity:.8}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:820px){.grid2{grid-template-columns:1fr}.search{min-width:0;width:100%}}
.kv{display:grid;grid-template-columns:140px 1fr;gap:6px 12px;font-size:13px}.kv span{color:var(--t3);font-weight:700}
.pre{white-space:pre-wrap}
.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;position:sticky;bottom:0;background:linear-gradient(transparent,var(--bg) 30%);padding:16px 0 4px}
.note{border-radius:10px;padding:10px 12px;font-size:13px;margin-bottom:12px}
.note.warn{background:var(--warnbg);color:#9a3412}.note.info{background:#eff6ff;color:#1e40af}.note.ok{background:var(--okbg);color:var(--ok)}
.spec{font-size:12px;color:var(--t2);margin-top:3px;white-space:pre-wrap}
.best{background:#ecfdf3!important;font-weight:800}
.chip{display:inline-block;font-size:11px;font-weight:700;border-radius:6px;padding:1px 6px;margin:1px 2px 1px 0;background:#eef2f7;color:var(--t2)}
.chip.ok{background:var(--okbg);color:var(--ok)}.chip.bad{background:var(--badbg);color:var(--bad)}
a.lk{color:var(--brand2);font-weight:700;text-decoration:none;cursor:pointer}
.ov{position:fixed;inset:0;background:rgba(15,30,53,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal{background:#fff;border-radius:16px;width:560px;max-width:100%;max-height:90vh;display:flex;flex-direction:column}
.modal .mh{padding:16px 18px 6px;font-weight:800;font-size:16px}.modal .ms{padding:0 18px;color:var(--t2);font-size:12.5px}
.modal .mb{padding:12px 18px;overflow:auto}.modal .mf{padding:12px 18px;display:flex;justify-content:flex-end;gap:8px;border-top:1px solid var(--bd)}
.fg{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}.fg label{font-size:12px;font-weight:700;color:var(--t2)}
.fg input,.fg textarea,.fg select{border:1px solid var(--bd);border-radius:9px;padding:8px 10px;background:#fff}
.fg textarea{min-height:80px;resize:vertical}
.ck{display:flex;gap:9px;align-items:center;padding:7px 4px;border-bottom:1px solid #f1f4f8;cursor:pointer}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 16px;border-radius:10px;font-weight:700;font-size:13px;opacity:0;pointer-events:none;transition:.2s;z-index:60}
.toast.on{opacity:1}.toast.err{background:var(--bad)}
details summary{cursor:pointer;font-weight:800;font-size:14px}
.tl{font-size:12.5px;border-left:2px solid var(--bd);margin-top:10px;padding-left:12px}
.tl div{margin-bottom:8px}.tl small{color:var(--t3)}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="empty">Cargando licitaciones…</div></div>
<div class="toast" id="toast"></div>
<script>
(function(){
'use strict';
// ═══ Conexiones ═══
var SB_URL='https://vsploxglutkbeokumunp.supabase.co', SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZzcGxveGdsdXRrYmVva3VtdW5wIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY3OTMyMzEsImV4cCI6MjA5MjM2OTIzMX0.wca52ejPsimIyG-iHS3TFRv4xjZF-55eDWoRR2I9nL0';
var CT_URL='https://uijuokwcsvnlzxoyvrcj.supabase.co', CT_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVpanVva3djc3ZubHp4b3l2cmNqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA1MTUwMDgsImV4cCI6MjA5NjA5MTAwOH0.-JtaWOf3QPRB5W1Z7rLp5Rabr83xdWIqX4GngkpFeJU';
var sb=null, ctsb=null;
try{ sb=window.supabase.createClient(SB_URL,SB_KEY); ctsb=window.supabase.createClient(CT_URL,CT_KEY); }catch(e){ console.warn(e); }
// Quien opera es la persona con sesión en Gerencia (auth.js)
var USER=(function(){
  var N={'kmedina@friopacking.pe':'Kiara Medina','ccalderon@friopacking.pe':'Carlos Calderón','gparedes@friopacking.pe':'Pablo Paredes'};
  var e=''; try{ e=(window.FP_AUTH&&FP_AUTH.email())||''; }catch(x){} e=String(e).toLowerCase();
  return N[e]||e||'Gerencia';
})();

// ═══ Utilidades ═══
var $=function(s,r){ return (r||document).querySelector(s); };
var $$=function(s,r){ return Array.prototype.slice.call((r||document).querySelectorAll(s)); };
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function nn(s){ return String(s==null?'':s).trim().toLowerCase(); }
function money(n,m){ return (m==='PEN'?'S/ ':'US$ ')+Number(n||0).toLocaleString('es-PE',{maximumFractionDigits:0}); }
function money2(n,m){ return (m==='PEN'?'S/ ':'US$ ')+Number(n||0).toLocaleString('es-PE',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function hoy(){ return new Intl.DateTimeFormat('en-CA',{timeZone:'America/Lima'}).format(new Date()); }
function fdate(s){ if(!s) return '—'; var d=new Date(String(s).length<=10?s+'T12:00:00':s); return isNaN(d)?'—':d.toLocaleDateString('es-PE',{day:'2-digit',month:'short',year:'numeric'}); }
function fdt(s){ if(!s) return '—'; var d=new Date(s); return isNaN(d)?'—':d.toLocaleString('es-PE',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}); }
function dias(f){ if(!f) return null; return Math.round((new Date(f+'T12:00:00')-new Date(hoy()+'T12:00:00'))/86400000); }
var tt; function toast(m,err){ var t=$('#toast'); t.textContent=m; t.classList.toggle('err',!!err); t.classList.add('on'); clearTimeout(tt); tt=setTimeout(function(){ t.classList.remove('on'); },3500); }
function chk(r){ if(r&&r.error) throw r.error; return r?r.data:null; }
async function evento(lic,accion,detalle){ try{ await sb.from('lic_eventos').insert({ licitacion_id:lic, usuario:USER, accion:accion, detalle:detalle||null }); }catch(e){ console.warn('evento',e); } }

// ═══ Etapas ═══
// Los valores de `estado` se mantienen (los usan el portal, el supervisor y los KPIs);
// aquí solo se agrupan en 4 etapas para Gerencia.
var ABIERTAS=['Publicada','Invitaciones','Ofertas'];
function etapa(L){
  var e=L.estado;
  if(e==='Por aprobar'||e==='Preparación') return 'aprobar';
  if(e==='Borrador'||e==='Observada') return 'prep';
  if(ABIERTAS.indexOf(e)>=0) return (L.fecha_limite && dias(L.fecha_limite)<0) ? 'evaluar' : 'abiertas';
  if(e==='Evaluación'||e==='Negociación') return 'evaluar';
  return 'cerradas';
}
function etiqueta(L){
  var e=L.estado;
  if(e==='Por aprobar'||e==='Preparación') return ['Por aprobar','p-apr'];
  if(e==='Borrador') return ['Borrador del supervisor','p-prep'];
  if(e==='Observada') return ['Devuelta al supervisor','p-prep'];
  if(ABIERTAS.indexOf(e)>=0) return (L.fecha_limite&&dias(L.fecha_limite)<0)?['Plazo vencido · evaluar','p-eval']:['Recibiendo ofertas','p-open'];
  if(e==='Evaluación'||e==='Negociación') return ['En evaluación','p-eval'];
  if(e==='Desierta'||e==='Cancelada') return ['Desierta','p-bad'];
  return ['Adjudicada','p-ok'];
}
var GRUPOS=[['aprobar','Por aprobar'],['abiertas','Recibiendo ofertas'],['evaluar','Por adjudicar'],['prep','En manos del supervisor'],['cerradas','Cerradas']];

var S={ lics:[], ofCount:{}, adj:{}, grupo:null, q:'', cur:null, cuentas:null };

// ═══ Bandeja ═══
async function cargarLista(){
  var r=await Promise.all([
    sb.from('lic_licitaciones').select('*').order('created_at',{ascending:false}),
    sb.from('lic_ofertas').select('licitacion_id'),
    sb.from('lic_adjudicaciones').select('licitacion_id,contratista,monto_adjudicado,moneda')
  ]);
  S.lics=chk(r[0])||[];
  S.ofCount={}; (chk(r[1])||[]).forEach(function(o){ S.ofCount[o.licitacion_id]=(S.ofCount[o.licitacion_id]||0)+1; });
  S.adj={}; (chk(r[2])||[]).forEach(function(a){ S.adj[a.licitacion_id]=a; });
}
async function bandeja(){
  try{ await cargarLista(); }catch(e){ $('#app').innerHTML='<div class="empty">No se pudo cargar: '+esc(e.message||e)+'</div>'; return; }
  if(!S.grupo){ var conAlgo=GRUPOS.filter(function(g){ return S.lics.some(function(L){ return etapa(L)===g[0]; }); })[0]; S.grupo=conAlgo?conAlgo[0]:'aprobar'; }
  pintarBandeja();
}
function pintarBandeja(){
  S.cur=null;
  var cnt={}; S.lics.forEach(function(L){ var g=etapa(L); cnt[g]=(cnt[g]||0)+1; });
  var q=nn(S.q);
  var lista=S.lics.filter(function(L){ return etapa(L)===S.grupo && (!q || nn([L.codigo,L.nombre,L.proyecto,L.especialidad].join(' ')).indexOf(q)>=0); });
  var cols=S.grupo==='cerradas'?['Ganador','Monto adjudicado']:(S.grupo==='abiertas'||S.grupo==='evaluar'?['Cierre','Ofertas']:['Enviada','Presupuesto base']);
  $('#app').innerHTML=
    '<div class="top"><div><div class="h1">Licitaciones</div><div class="sub">El supervisor arma la licitación; Gerencia la aprueba, recibe ofertas y adjudica.</div></div>'+
      '<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><input class="search" id="q" placeholder="Buscar código, obra o nombre" value="'+esc(S.q)+'"><a class="lk" href="licitaciones-clasico.html" style="font-size:12px">Vista anterior</a></div></div>'+
    '<div class="tabs">'+GRUPOS.map(function(g){ return '<button class="tab'+(S.grupo===g[0]?' on':'')+'" data-g="'+g[0]+'">'+g[1]+' <b>'+(cnt[g[0]]||0)+'</b></button>'; }).join('')+'</div>'+
    (lista.length?'<div class="tw"><table><thead><tr><th>Código</th><th>Licitación</th><th>Obra</th><th>Estado</th><th>'+cols[0]+'</th><th class="num">'+cols[1]+'</th></tr></thead><tbody>'+
      lista.map(function(L){
        var et=etiqueta(L), c1, c2;
        if(S.grupo==='cerradas'){ var a=S.adj[L.id]; c1=a?esc(a.contratista):'—'; c2=a?money(a.monto_adjudicado,a.moneda||L.moneda):'—'; }
        else if(S.grupo==='abiertas'||S.grupo==='evaluar'){ var d=dias(L.fecha_limite); c1=fdate(L.fecha_limite)+(d!=null?' <span style="color:var(--t3);font-size:12px">'+(d<0?'(venció)':d===0?'(hoy)':'('+d+' d)')+'</span>':''); c2=String(S.ofCount[L.id]||0); }
        else { c1=L.enviado_at?fdate(L.enviado_at):'—'; c2=money(L.presupuesto_base,L.moneda); }
        return '<tr class="row" data-id="'+L.id+'"><td class="mono">'+esc(L.codigo)+'</td><td><b>'+esc(L.nombre)+'</b>'+(L.especialidad?'<div class="sub">'+esc(L.especialidad)+'</div>':'')+'</td><td>'+esc(L.proyecto||'—')+'</td><td><span class="pill '+et[1]+'">'+et[0]+'</span></td><td>'+c1+'</td><td class="num">'+c2+'</td></tr>';
      }).join('')+'</tbody></table></div>'
      :'<div class="card empty">'+({aprobar:'No hay licitaciones esperando aprobación. Las arma el supervisor desde su pestaña Licitaciones.',abiertas:'No hay licitaciones recibiendo ofertas.',evaluar:'No hay licitaciones por adjudicar.',prep:'Ningún supervisor está armando licitaciones ahora.',cerradas:'Aún no hay licitaciones cerradas.'}[S.grupo])+'</div>');
  $$('[data-g]').forEach(function(b){ b.onclick=function(){ S.grupo=b.dataset.g; pintarBandeja(); }; });
  $$('tr.row').forEach(function(tr){ tr.onclick=function(){ abrir(tr.dataset.id); }; });
  var qi=$('#q'); qi.oninput=function(){ S.q=qi.value; var p=qi.selectionStart; pintarBandeja(); var n=$('#q'); n.focus(); n.setSelectionRange(p,p); };
}

// ═══ Detalle ═══
async function abrir(id){
  $('#app').innerHTML='<div class="empty">Cargando…</div>';
  try{
    var r=await Promise.all([
      sb.from('lic_licitaciones').select('*').eq('id',id).single(),
      sb.from('lic_partidas').select('*').eq('licitacion_id',id).order('orden'),
      sb.from('lic_documentos').select('*').eq('licitacion_id',id).order('created_at'),
      sb.from('lic_invitados').select('*').eq('licitacion_id',id).order('invitado_at'),
      sb.from('lic_consultas').select('*').eq('licitacion_id',id).order('created_at'),
      sb.from('lic_adendas').select('*').eq('licitacion_id',id).order('numero'),
      sb.from('lic_ofertas').select('*').eq('licitacion_id',id).order('monto_total'),
      sb.from('lic_adjudicaciones').select('*').eq('licitacion_id',id).maybeSingle(),
      sb.from('lic_eventos').select('*').eq('licitacion_id',id).order('created_at',{ascending:false}),
      sb.from('lic_negociaciones').select('*').eq('licitacion_id',id).order('ronda')
    ]);
    var c={ L:chk(r[0]), partidas:chk(r[1])||[], docs:chk(r[2])||[], invitados:chk(r[3])||[], consultas:chk(r[4])||[], adendas:chk(r[5])||[], ofertas:chk(r[6])||[], adj:chk(r[7]), eventos:chk(r[8])||[], negs:chk(r[9])||[] };
    var ids=c.ofertas.map(function(o){ return o.id; });
    c.items=ids.length?(chk(await sb.from('lic_oferta_items').select('*').in('oferta_id',ids))||[]):[];
    c.facturas=[];
    if(c.adj&&c.adj.contrato_codigo&&ctsb){ try{ var f=await ctsb.rpc('contrato_ejecucion',{p_contrato:c.adj.contrato_codigo}); c.facturas=f.data||[]; }catch(e){} }
    S.cur=c; pintarDetalle();
  }catch(e){ $('#app').innerHTML='<button class="btn back" id="volver">← Volver</button><div class="card empty">No se pudo abrir: '+esc(e.message||e)+'</div>'; $('#volver').onclick=bandeja; }
}
function base(c){ return c.partidas.reduce(function(s,p){ return s+Number(p.cantidad||0)*Number(p.pu_base||0); },0); }
function pintarDetalle(){
  var c=S.cur, L=c.L, et=etiqueta(L), g=etapa(L);
  var orden=['aprobar','abiertas','evaluar','cerradas'], pos=g==='prep'?-1:orden.indexOf(g);
  var pasos=[['Revisión','aprobar y publicar'],['Ofertas','hasta la fecha límite'],['Evaluación','comparar, negociar, adjudicar'],['Adjudicada','contrato y facturación']];
  var monto=c.adj?c.adj.monto_adjudicado:base(c);
  var d=dias(L.fecha_limite);
  $('#app').innerHTML=
    '<button class="btn back" id="volver">← Licitaciones</button>'+
    '<div class="head"><div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap"><div style="min-width:0"><div class="cod">'+esc(L.codigo)+'</div><div class="nm">'+esc(L.nombre)+'</div>'+
      '<div class="meta"><span>Obra: <b>'+esc(L.proyecto||'—')+'</b></span>'+(L.especialidad?'<span>'+esc(L.especialidad)+'</span>':'')+'<span>Fecha límite: <b>'+fdate(L.fecha_limite)+'</b>'+(d!=null&&g==='abiertas'?' ('+(d===0?'hoy':d+' días')+')':'')+'</span>'+(L.creado_por_email?'<span>Armada por '+esc(L.creado_por_email)+'</span>':'')+'</div></div>'+
      '<div style="text-align:right"><div style="font-size:20px;font-weight:800">'+money(monto,L.moneda)+'</div><div style="font-size:12px;opacity:.7;margin-bottom:6px">'+(c.adj?'adjudicado':'presupuesto base')+'</div><span class="pill">'+et[0]+'</span></div></div>'+
      (L.estado==='Desierta'||L.estado==='Cancelada'?'':'<div class="steps">'+pasos.map(function(p,i){ return '<div class="step'+(i<pos?' done':i===pos?' cur':'')+'">'+(i<pos?'✓ ':'')+p[0]+'<small>'+p[1]+'</small></div>'; }).join('')+'</div>')+
    '</div>'+
    '<div id="cuerpo"></div>';
  $('#volver').onclick=function(){ bandeja(); };
  var cuerpo=$('#cuerpo');
  if(g==='aprobar'||g==='prep') cuerpo.innerHTML=vRevision(c,g);
  else if(g==='abiertas') cuerpo.innerHTML=vOfertasAbiertas(c);
  else if(g==='evaluar') cuerpo.innerHTML=vEvaluacion(c);
  else cuerpo.innerHTML=vCerrada(c);
  cuerpo.insertAdjacentHTML('beforeend', vHistorial(c));
  enlazar(g);
}

// ── Etapa 3: Evaluación ──
function montoFinal(c,o){
  var ns=c.negs.filter(function(n){ return n.oferta_id===o.id && (n.estado==='Aceptada'||n.estado==='Contraoferta') && n.monto_respuesta; });
  return ns.length?Number(ns[ns.length-1].monto_respuesta):Number(o.monto_total||0);
}
function plazoFinal(c,o){
  var ns=c.negs.filter(function(n){ return n.oferta_id===o.id && n.plazo_respuesta; });
  return ns.length?ns[ns.length-1].plazo_respuesta:o.plazo_dias;
}
function formatos(o){
  var t=(o.adjuntos||[]).map(function(a){ return a.tipo; });
  return ['Presupuesto','Cronograma','Garantía'].map(function(x){ return '<span class="chip '+(t.indexOf(x)>=0?'ok':'bad')+'">'+x+'</span>'; }).join('');
}
function vEvaluacion(c){
  var L=c.L;
  if(!c.ofertas.length) return '<div class="note warn">No llegó ninguna oferta. Puedes prorrogar la fecha (vuelve a recibir ofertas) o declararla desierta.</div>'+
    '<div class="actions"><button class="btn bad" id="desierta">Declarar desierta</button><button class="btn pri" id="prorroga">Prorrogar fecha</button></div>';
  var ofs=c.ofertas.slice().sort(function(a,b){ return montoFinal(c,a)-montoFinal(c,b); });
  var mejor=montoFinal(c,ofs[0]), bs=base(c);
  var it={}; c.items.forEach(function(x){ it[x.oferta_id+'|'+x.partida_id]=x; });
  var resumen='<div class="card"><h3>Ofertas recibidas</h3><div class="hint">Ordenadas de la más barata a la más cara. El monto final considera la negociación.</div><div class="tw"><table><thead><tr><th>Contratista</th><th class="num">Ofertó</th><th class="num">Monto final</th><th class="num">vs. base</th><th class="num">Plazo</th><th>Formatos</th><th>Negociación</th><th></th></tr></thead><tbody>'+
    ofs.map(function(o){
      var mf=montoFinal(c,o), dif=bs?((mf-bs)/bs*100):null;
      var ns=c.negs.filter(function(n){ return n.oferta_id===o.id; }), un=ns[ns.length-1];
      var neg=!un?'—':un.estado==='Pendiente'?'<span class="chip">Pidió '+money(un.monto_pedido,L.moneda)+' · esperando</span>':'<span class="chip '+(un.estado==='Rechazada'?'bad':'ok')+'">'+esc(un.estado)+(un.monto_respuesta?' '+money(un.monto_respuesta,L.moneda):'')+'</span>';
      return '<tr'+(mf===mejor?' class="best"':'')+'><td><b>'+esc(o.contratista||o.email)+'</b>'+(mf===mejor?' <span class="chip ok">mejor precio</span>':'')+'<div class="sub">'+esc(o.email||'')+'</div></td>'+
        '<td class="num">'+money(o.monto_total,L.moneda)+'</td><td class="num"><b>'+money(mf,L.moneda)+'</b></td><td class="num" style="color:'+(dif!=null&&dif>0?'var(--bad)':'var(--ok)')+'">'+(dif==null?'—':(dif>0?'+':'')+dif.toFixed(1)+'%')+'</td>'+
        '<td class="num">'+(plazoFinal(c,o)?plazoFinal(c,o)+' d':'—')+'</td><td>'+formatos(o)+((o.adjuntos||[]).length?'<div><a class="lk" data-adjs="'+o.id+'" style="font-size:12px">Ver archivos</a></div>':'')+'</td><td>'+neg+'</td>'+
        '<td style="white-space:nowrap"><button class="btn sm" data-negociar="'+o.id+'"'+(un&&un.estado==='Pendiente'?' disabled title="Esperando respuesta"':'')+'>Pedir mejora</button> <button class="btn sm pri" data-adjudicar="'+o.id+'">Adjudicar</button></td></tr>';
    }).join('')+'</tbody></table></div></div>';
  var detalle='<div class="card"><details><summary>Comparar por partida</summary><div class="tw" style="margin-top:10px"><table><thead><tr><th>Partida</th><th class="num">Cant.</th><th class="num">Base</th>'+ofs.map(function(o){ return '<th class="num">'+esc(o.contratista||o.email)+'</th>'; }).join('')+'</tr></thead><tbody>'+
    c.partidas.map(function(p){
      var vals=ofs.map(function(o){ var x=it[o.id+'|'+p.id]; return x?Number(x.pu||0)*Number(p.cantidad||0):null; });
      var min=Math.min.apply(null,vals.filter(function(v){ return v!=null; }));
      return '<tr><td>'+esc(p.descripcion)+'</td><td class="num">'+Number(p.cantidad||0).toLocaleString('es-PE')+'</td><td class="num">'+money(Number(p.cantidad||0)*Number(p.pu_base||0),L.moneda)+'</td>'+
        vals.map(function(v){ return '<td class="num'+(v!=null&&v===min?' best':'')+'">'+(v==null?'—':money(v,L.moneda))+'</td>'; }).join('')+'</tr>';
    }).join('')+'</tbody></table></div></details></div>';
  return resumen+detalle+'<div class="actions"><button class="btn bad" id="desierta">Declarar desierta</button></div>';
}

function vCerrada(c){
  var L=c.L, a=c.adj;

  var mon=a.moneda||L.moneda, fac=c.facturas.reduce(function(s,f){ return s+Number(f.monto||0); },0);
  return '<div class="card"><h3>Adjudicada a '+esc(a.contratista)+'</h3><div class="kv" style="margin-top:8px">'+
      '<span>Monto</span><div><b>'+money2(a.monto_adjudicado,mon)+'</b></div>'+
      '<span>Contrato</span><div class="mono">'+esc(a.contrato_codigo||'—')+'</div>'+
      '<span>Fecha</span><div>'+fdate(a.fecha||a.created_at)+'</div>'+
      '<span>Aprobó</span><div>'+esc(a.responsable||'—')+'</div>'+
      (a.justificacion?'<span>Motivo</span><div class="pre">'+esc(a.justificacion)+'</div>':'')+
    '</div></div>'+
    '<div class="card"><h3>Ejecución del contrato</h3><div class="hint">Facturas que el contratista registró en su portal con este contrato.</div>'+
      '<div class="kv"><span>Facturado</span><div>'+money2(fac,mon)+'</div><span>Saldo</span><div><b>'+money2(Number(a.monto_adjudicado||0)-fac,mon)+'</b></div></div>'+
      (c.facturas.length?'<div class="tw" style="margin-top:10px"><table><thead><tr><th>Factura</th><th>Fecha</th><th>Estado</th><th class="num">Monto</th></tr></thead><tbody>'+c.facturas.map(function(f){ return '<tr><td>'+esc(f.num||'—')+'</td><td>'+fdate(f.fecha)+'</td><td>'+esc(f.estado||'')+'</td><td class="num">'+money2(f.monto,mon)+'</td></tr>'; }).join('')+'</tbody></table></div>':'')+
    '</div>'+vPartidas(c,false);
}

// ═══ Acciones ═══
function modal(o){
  var w=document.createElement('div'); w.className='ov';
  w.innerHTML='<div class="modal"><div class="mh">'+o.title+'</div>'+(o.sub?'<div class="ms">'+o.sub+'</div>':'')+'<div class="mb">'+o.body+'</div><div class="mf"><button class="btn" data-x>Cancelar</button><button class="btn pri" data-ok>'+(o.ok||'Guardar')+'</button></div></div>';
  document.body.appendChild(w);
  var cerrar=function(){ w.remove(); };
  w.querySelector('[data-x]').onclick=cerrar; w.onclick=function(e){ if(e.target===w) cerrar(); };
  var b=w.querySelector('[data-ok]');
  b.onclick=async function(){ b.disabled=true; try{ var r=await o.fn(w); if(r!==false) cerrar(); else b.disabled=false; }catch(e){ toast(e.message||String(e),true); b.disabled=false; } };
  if(o.after) o.after(w);
  return w;
}
async function cambiarEstado(L,to,extra){
  var upd=Object.assign({estado:to},extra||{});
  chk(await sb.from('lic_licitaciones').update(upd).eq('id',L.id));
  await evento(L.id,'Cambio de estado',L.estado+' → '+to);
}
async function verArchivo(path,url){
  if(!path){ if(url) window.open(url,'_blank'); return; }
  var w=window.open('about:blank','_blank');
  var r=await sb.storage.from('lic-expediente').createSignedUrl(path,3600);
  if(r.error){ if(w) w.close(); toast('No se pudo abrir el archivo',true); return; }
  if(w) w.location.href=r.data.signedUrl; else location.href=r.data.signedUrl;
}
async function cuentas(){
  if(S.cuentas) return S.cuentas;
  try{ var r=await ctsb.rpc('contratistas_para_licitar'); S.cuentas=r.data||[]; }catch(e){ S.cuentas=[]; }
  return S.cuentas;
}
async function agregarInvitados(c,estado){
  var lista=(await cuentas()).filter(function(x){ return !c.invitados.some(function(v){ return nn(v.email)===nn(x.email); }); });
  modal({ title:'Agregar contratistas', sub:'Empresas con cuenta en el portal de contratistas.', ok:'Agregar',
    body:'<input class="search" id="mq" placeholder="Buscar empresa o correo" style="width:100%;margin-bottom:8px"><div id="ml" style="max-height:50vh;overflow:auto"></div>',
    after:function(w){ var marc={};
      function pinta(q){ q=nn(q); w.querySelector('#ml').innerHTML=lista.filter(function(x){ return !q||nn(x.empresa+' '+x.email).indexOf(q)>=0; }).map(function(x){ return '<label class="ck"><input type="checkbox" data-e="'+esc(x.email)+'" data-n="'+esc(x.empresa)+'"'+(marc[x.email]?' checked':'')+'><div><b>'+esc(x.empresa)+'</b><div class="sub">'+esc(x.email)+'</div></div></label>'; }).join('')||'<div class="empty">Nadie coincide.</div>'; }
      w.querySelector('#ml').addEventListener('change',function(e){ var cb=e.target; if(cb.dataset.e) marc[cb.dataset.e]=cb.checked?cb.dataset.n:null; });
      w.querySelector('#mq').oninput=function(){ pinta(this.value); }; pinta(''); w._marc=marc; },
    fn:async function(w){
      var sel=Object.keys(w._marc).filter(function(k){ return w._marc[k]; });
      if(!sel.length){ toast('Marca al menos una empresa',true); return false; }
      chk(await sb.from('lic_invitados').insert(sel.map(function(e){ return { licitacion_id:c.L.id, email:e, contratista:w._marc[e], estado:estado, invitado_at:new Date().toISOString() }; })));
      await evento(c.L.id,'Invitación',sel.length+' contratista(s) '+(estado==='Invitado'?'invitado(s)':'agregado(s)'));
      toast('Agregado'); abrir(c.L.id);
    }});
}
function enlazar(g){
  var c=S.cur, L=c.L;
  $$('[data-ver]').forEach(function(a){ a.onclick=function(){ verArchivo(a.dataset.ver,a.dataset.url); }; });
  var ai=$('#addinv'); if(ai) ai.onclick=function(){ agregarInvitados(c, g==='abiertas'?'Invitado':'Sugerido'); };
  $$('[data-quitari]').forEach(function(b){ b.onclick=async function(){ try{ chk(await sb.from('lic_invitados').delete().eq('id',b.dataset.quitari)); abrir(L.id); }catch(e){ toast(e.message,true); } }; });
  $$('[data-quitarp]').forEach(function(b){ b.onclick=async function(){ if(!confirm('¿Quitar esta partida de la licitación?')) return; try{ chk(await sb.from('lic_partidas').delete().eq('id',b.dataset.quitarp)); var rest=c.partidas.filter(function(p){ return p.id!==b.dataset.quitarp; }); await sb.from('lic_licitaciones').update({presupuesto_base:Math.round(rest.reduce(function(s,p){ return s+Number(p.cantidad||0)*Number(p.pu_base||0); },0))}).eq('id',L.id); await evento(L.id,'Partida quitada',''); abrir(L.id); }catch(e){ toast(e.message,true); } }; });

  var ap=$('#aprobar'); if(ap) ap.onclick=async function(){
    var f=$('#flim').value;
    if(!c.partidas.length){ toast('Sin partidas no se puede publicar: devuélvela al supervisor',true); return; }
    if(!f){ toast('Pon la fecha límite para ofertar',true); $('#flim').focus(); return; }
    if(f<hoy()){ toast('La fecha límite no puede ser pasada',true); return; }
    if(!c.invitados.length){ toast('Agrega al menos un contratista',true); return; }
    if(!confirm('¿Publicar? Los '+c.invitados.length+' contratistas la verán en su portal y podrán ofertar hasta el '+fdate(f)+'.')) return;
    ap.disabled=true;
    try{
      await cambiarEstado(L,'Publicada',{ fecha_limite:f, aprobado_por:USER, aprobado_at:new Date().toISOString(), presupuesto_base:Math.round(base(c)), moneda:L.moneda||'USD' });
      var sug=c.invitados.filter(function(v){ return v.estado==='Sugerido'||!v.estado; });
      if(sug.length) chk(await sb.from('lic_invitados').update({ estado:'Invitado', invitado_at:new Date().toISOString() }).in('id',sug.map(function(v){ return v.id; })));
      toast('Publicada'); abrir(L.id);
    }catch(e){ toast(e.message||String(e),true); ap.disabled=false; }
  };
  var dv=$('#devolver'); if(dv) dv.onclick=function(){
    modal({ title:'Devolver al supervisor', sub:'Vuelve a «Observada» para que la corrija y la reenvíe.', ok:'Devolver',
      body:'<div class="fg"><label>Qué tiene que corregir</label><textarea id="obs"></textarea></div>',
      fn:async function(w){ var t=w.querySelector('#obs').value.trim(); if(!t){ toast('Escribe qué tiene que corregir',true); return false; }
        await cambiarEstado(L,'Observada',{ observacion_gerencia:t }); await evento(L.id,'Observación de Gerencia',t.slice(0,140)); toast('Devuelta al supervisor'); S.grupo='prep'; bandeja(); } });
  };
  var el=$('#eliminar'); if(el) el.onclick=async function(){
    if(!confirm('¿Eliminar «'+L.nombre+'»? Se borran sus partidas, invitados y adjuntos. No se puede deshacer.')) return;
    try{
      var paths=c.docs.map(function(d){ return d.path; }).filter(Boolean);
      if(paths.length) await sb.storage.from('lic-expediente').remove(paths);
      for(var t of ['lic_partidas','lic_invitados','lic_documentos','lic_consultas','lic_adendas','lic_eventos']) chk(await sb.from(t).delete().eq('licitacion_id',L.id));
      chk(await sb.from('lic_licitaciones').delete().eq('id',L.id));
      toast('Eliminada'); bandeja();
    }catch(e){ toast(e.message||String(e),true); }
  };
  $$('[data-responder]').forEach(function(b){ b.onclick=async function(){
    var id=b.dataset.responder, t=$('[data-resp="'+id+'"]').value.trim(); if(!t){ toast('Escribe la respuesta',true); return; }
    b.disabled=true;
    try{ chk(await sb.from('lic_consultas').update({ respuesta:t, publica:$('[data-pub="'+id+'"]').checked, estado:'Respondida', responsable:USER, respondida_at:new Date().toISOString() }).eq('id',id));
      await evento(L.id,'Consulta respondida',t.slice(0,80)); toast('Respondida'); abrir(L.id); }catch(e){ toast(e.message,true); b.disabled=false; } }; });
  var av=$('#addaviso'); if(av) av.onclick=function(){
    modal({ title:'Aviso a los invitados', sub:'Lo ven todos los invitados como novedad en su portal.', ok:'Publicar aviso',
      body:'<div class="fg"><label>Título</label><input id="at" placeholder="Ej.: Se agrega el plano de la sala de máquinas"></div><div class="fg"><label>Detalle</label><textarea id="ad"></textarea></div>',
      fn:async function(w){ var t=w.querySelector('#at').value.trim(); if(!t){ toast('Ponle título',true); return false; }
        chk(await sb.from('lic_adendas').insert({ licitacion_id:L.id, numero:c.adendas.length+1, titulo:t, tipo:'Aviso', cambios:w.querySelector('#ad').value.trim()||null, creado_por:USER }));
        await evento(L.id,'Adenda emitida','N° '+(c.adendas.length+1)+' · '+t); toast('Aviso publicado'); abrir(L.id); } });
  };
  var pr=$('#prorroga'); if(pr) pr.onclick=function(){
    modal({ title:'Prorrogar la fecha límite', sub:'Los invitados pueden ofertar hasta el fin del nuevo día.', ok:'Prorrogar',
      body:'<div class="fg"><label>Nueva fecha límite</label><input type="date" id="nf" min="'+hoy()+'"></div>',
      fn:async function(w){ var f=w.querySelector('#nf').value; if(!f||f<hoy()){ toast('Elige una fecha desde hoy',true); return false; }
        await cambiarEstado(L,'Publicada',{ fecha_limite:f });
        chk(await sb.from('lic_adendas').insert({ licitacion_id:L.id, numero:c.adendas.length+1, titulo:'Prórroga hasta el '+fdate(f), tipo:'Prórroga', creado_por:USER }));
        await evento(L.id,'Adenda emitida','Prórroga hasta el '+fdate(f)); toast('Fecha prorrogada'); abrir(L.id); } });
  };
  var ce=$('#cerrar'); if(ce) ce.onclick=async function(){
    var d=dias(L.fecha_limite);
    if(!confirm(d!=null&&d>=0?'La fecha límite es el '+fdate(L.fecha_limite)+'. Si cierras ahora, los invitados ya no podrán ofertar. ¿Cerrar?':'¿Cerrar la recepción y pasar a evaluar?')) return;
    try{ await cambiarEstado(L,'Evaluación'); toast('Recepción cerrada'); abrir(L.id); }catch(e){ toast(e.message,true); }
  };
  var ds=$('#desierta'); if(ds) ds.onclick=function(){
    modal({ title:'Declarar desierta', sub:'La licitación se cierra sin ganador.', ok:'Declarar desierta',
      body:'<div class="fg"><label>Motivo</label><textarea id="mot"></textarea></div>',
      fn:async function(w){ var t=w.querySelector('#mot').value.trim(); if(!t){ toast('Escribe el motivo',true); return false; }
        await cambiarEstado(L,'Desierta'); await evento(L.id,'Desierta',t.slice(0,140)); toast('Declarada desierta'); abrir(L.id); } });
  };
  $$('[data-adjs]').forEach(function(a){ a.onclick=function(){ var o=c.ofertas.find(function(x){ return x.id===a.dataset.adjs; });
    modal({ title:'Archivos de '+esc(o.contratista||o.email), ok:'Listo', body:(o.adjuntos||[]).map(function(x,i){ return '<div class="ck" style="cursor:default"><span class="chip">'+esc(x.tipo||'Otro')+'</span><div style="flex:1">'+esc(x.nombre)+'</div><a class="lk" data-f="'+i+'">Abrir</a></div>'; }).join(''),
      after:function(w){ $$('[data-f]',w).forEach(function(l){ l.onclick=function(){ verArchivo(o.adjuntos[+l.dataset.f].path); }; }); }, fn:function(){} }); }; });
  $$('[data-negociar]').forEach(function(b){ b.onclick=function(){
    var o=c.ofertas.find(function(x){ return x.id===b.dataset.negociar; }), mf=montoFinal(c,o);
    modal({ title:'Pedir mejora a '+esc(o.contratista||o.email), sub:'Oferta actual '+money2(mf,L.moneda)+'. El contratista responde desde su portal (acepta, contraoferta o rechaza).', ok:'Enviar pedido',
      body:'<div class="fg"><label>Monto que le pides</label><input type="number" id="nm" step="0.01" min="0"></div><div class="fg"><label>Plazo (días, opcional)</label><input type="number" id="np" min="1" value="'+esc(plazoFinal(c,o)||'')+'"></div><div class="fg"><label>Comentario</label><textarea id="nc"></textarea></div>',
      fn:async function(w){ var m=Number(w.querySelector('#nm').value); if(!(m>0)){ toast('Indica el monto',true); return false; }
        var ronda=c.negs.filter(function(n){ return n.oferta_id===o.id; }).length+1, p=w.querySelector('#np').value;
        chk(await sb.from('lic_negociaciones').insert({ licitacion_id:L.id, oferta_id:o.id, ronda:ronda, monto_pedido:m, plazo_pedido:p?Number(p):null, comentario:w.querySelector('#nc').value.trim()||null, usuario:USER, estado:'Pendiente' }));
        if(L.estado!=='Negociación') await cambiarEstado(L,'Negociación');
        await evento(L.id,'Negociación','Pedido a '+(o.contratista||o.email)+': '+money2(m,L.moneda)); toast('Pedido enviado'); abrir(L.id); } });
  }; });
  $$('[data-adjudicar]').forEach(function(b){ b.onclick=function(){
    var o=c.ofertas.find(function(x){ return x.id===b.dataset.adjudicar; }), mf=montoFinal(c,o);
    var n=0, y=hoy().slice(0,4); S.lics.forEach(function(x){ var a=S.adj[x.id]; var m=a&&String(a.contrato_codigo||'').match(new RegExp('CTR-'+y+'-(\\d+)')); if(m) n=Math.max(n,+m[1]); });
    modal({ title:'Adjudicar a '+esc(o.contratista||o.email), sub:'El ganador verá su contrato en el portal; los demás solo verán que se adjudicó.', ok:'Adjudicar',
      body:'<div class="fg"><label>Monto adjudicado ('+(L.moneda==='PEN'?'S/':'US$')+')</label><input type="number" id="am" step="0.01" value="'+mf+'"></div><div class="fg"><label>Código de contrato</label><input id="ac" value="CTR-'+y+'-'+String(n+1).padStart(3,'0')+'"></div><div class="fg"><label>Motivo</label><textarea id="aj">'+(mf===montoFinal(c,c.ofertas.slice().sort(function(a,b){ return montoFinal(c,a)-montoFinal(c,b); })[0])?'Mejor oferta económica.':'')+'</textarea></div>',
      fn:async function(w){ var m=Number(w.querySelector('#am').value), j=w.querySelector('#aj').value.trim();
        if(!(m>0)){ toast('Indica el monto',true); return false; } if(!j){ toast('Escribe el motivo',true); return false; }
        chk(await sb.from('lic_adjudicaciones').insert({ licitacion_id:L.id, licitacion_codigo:L.codigo, oferta_id:o.id, email:o.email||null, contratista:o.contratista, monto_adjudicado:m, moneda:L.moneda||'USD', contrato_codigo:w.querySelector('#ac').value.trim()||null, responsable:USER, aprobador:USER, justificacion:j }));
        chk(await sb.from('lic_ofertas').update({ estado:'Adjudicada' }).eq('id',o.id));
        await cambiarEstado(L,'Adjudicación');
        await evento(L.id,'Adjudicación','Adjudicado a '+o.contratista+' — '+money2(m,L.moneda)); toast('Adjudicada a '+o.contratista); abrir(L.id); } });
  }; });
}

// ═══ Arranque ═══
var qs=new URLSearchParams(location.search);
if(qs.get('id')) abrir(qs.get('id')); else bandeja();
})();
</script>
