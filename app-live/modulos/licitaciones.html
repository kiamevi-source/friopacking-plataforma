<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Licitaciones — Centro de Control · Grupo Friopacking</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style>
:root{
  --navy:#0f1e35; --navy2:#0a1729; --brand:#0ea5a4; --teal:#3ECBB0; --teal2:#2db59a;
  --blue:#2E7DD1; --amber:#d69e2e; --red:#e2685f; --purple:#8b5cf6; --green:#10b981;
  --t2:#475569; --t3:#94a3b8; --bd:rgba(15,23,42,.08); --surf:#fff; --bg:#f5f7fa;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:Manrope,system-ui,sans-serif;background:var(--bg);color:var(--navy);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:1280px;margin:0 auto;padding:22px 22px 80px}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:8px;border:2px solid var(--bg)}

/* ─── Header ─── */
.lc-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.lc-eyebrow{display:inline-flex;align-items:center;gap:7px;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--brand)}
.lc-eyebrow .dot{width:7px;height:7px;border-radius:50%;background:var(--teal);box-shadow:0 0 0 3px rgba(62,203,176,.18)}
.lc-h1{font-size:25px;font-weight:800;letter-spacing:-.5px;margin:6px 0 2px}
.lc-sub{font-size:13px;color:var(--t2);font-weight:500}
.lc-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{appearance:none;border:1px solid var(--bd);background:#fff;color:var(--t2);font-weight:700;font-size:13px;padding:9px 14px;border-radius:10px;display:inline-flex;align-items:center;gap:7px;transition:.15s}
.btn:hover{background:#f8fafc;border-color:rgba(46,125,209,.3);color:var(--navy)}
.btn i{width:15px;height:15px}
.btn-primary{background:var(--teal);border-color:var(--teal);color:#fff;box-shadow:0 4px 12px rgba(62,203,176,.35)}
.btn-primary:hover{background:var(--teal2);border-color:var(--teal2);color:#fff}
.btn-ghost{background:transparent;border-color:transparent}
.btn-sm{padding:6px 10px;font-size:12px}
.btn-danger{color:var(--red);border-color:rgba(226,104,95,.3)}
.btn-danger:hover{background:rgba(226,104,95,.08);color:#c0453b}

/* ─── Tabs (list/detail switch not needed; internal tabs) ─── */
.lc-tabs{display:inline-flex;gap:4px;background:#f1f5f9;border:1px solid var(--bd);border-radius:12px;padding:4px;flex-wrap:wrap}
.lc-tab{border:none;background:transparent;font-size:13px;font-weight:700;color:var(--t2);padding:8px 14px;border-radius:9px;display:inline-flex;align-items:center;gap:7px;transition:.15s}
.lc-tab:hover{color:var(--navy)}
.lc-tab.active{background:#fff;color:var(--navy);box-shadow:0 1px 2px rgba(15,23,42,.1),0 2px 8px -4px rgba(15,23,42,.18)}
.lc-tab .cnt{font-size:11px;font-weight:800;background:rgba(14,165,164,.12);color:#0a8f8e;padding:1px 7px;border-radius:20px}

/* ─── KPI cards ─── */
.kgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
@media(max-width:1080px){.kgrid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:520px){.kgrid{grid-template-columns:1fr}}
.kc{position:relative;overflow:hidden;background:linear-gradient(180deg,#fff,#fcfdfe);border:1px solid var(--bd);border-radius:14px;padding:15px 16px;box-shadow:0 1px 2px rgba(15,23,42,.05);transition:.18s;cursor:default}
.kc.click{cursor:pointer}
.kc.click:hover{transform:translateY(-2px);box-shadow:0 12px 28px -14px rgba(15,23,42,.22)}
.kc .tl{position:absolute;top:0;left:0;right:0;height:3px}
.kc .ico{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;margin-bottom:10px}
.kc .ico i{width:17px;height:17px}
.kc .num{font-size:27px;font-weight:800;line-height:1;letter-spacing:-1px}
.kc .lbl{font-size:10.5px;font-weight:800;color:var(--t3);text-transform:uppercase;letter-spacing:.05em;margin-top:8px}
.kc .sub{font-size:11.5px;color:var(--t2);margin-top:5px;font-weight:600}
.secttl{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--t3);margin:20px 0 10px;display:flex;align-items:center;gap:8px}

/* ─── Alert strips ─── */
.alerts{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:6px}
@media(max-width:1080px){.alerts{grid-template-columns:repeat(2,1fr)}}
@media(max-width:520px){.alerts{grid-template-columns:1fr}}
.alert{background:#fff;border:1px solid var(--bd);border-left-width:4px;border-radius:12px;padding:12px 14px;box-shadow:0 1px 2px rgba(15,23,42,.05)}
.alert.warn{border-left-color:var(--amber)}.alert.crit{border-left-color:var(--red)}.alert.info{border-left-color:var(--blue)}.alert.ok{border-left-color:var(--green)}
.alert .an{font-size:20px;font-weight:800;letter-spacing:-.5px}
.alert.warn .an{color:#a9761b}.alert.crit .an{color:#c0453b}.alert.info .an{color:#2266b0}.alert.ok .an{color:#0f7a54}
.alert .al{font-size:11.5px;font-weight:700;color:var(--t2);margin-top:2px}

/* ─── Licitaciones list ─── */
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:13px}
.lcard{background:linear-gradient(180deg,#fff,#fcfdfe);border:1px solid var(--bd);border-radius:16px;padding:16px 17px;box-shadow:0 1px 2px rgba(15,23,42,.05),0 4px 14px -8px rgba(15,23,42,.1);transition:.18s;cursor:pointer;position:relative;overflow:hidden}
.lcard:hover{transform:translateY(-3px);box-shadow:0 2px 4px rgba(15,23,42,.06),0 16px 34px -12px rgba(15,23,42,.24);border-color:rgba(46,125,209,.22)}
.lcard-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.lcard-cod{font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:600;color:var(--brand)}
.lcard-name{font-size:15.5px;font-weight:800;color:var(--navy);margin-top:3px;line-height:1.25}
.lcard-meta{display:flex;flex-wrap:wrap;gap:5px 14px;margin-top:10px;font-size:12px;color:var(--t2);font-weight:600}
.lcard-meta i{width:13px;height:13px;vertical-align:-2px;margin-right:3px}
.lcard-foot{display:flex;align-items:center;justify-content:space-between;margin-top:13px;padding-top:12px;border-top:1px solid var(--bd)}
.lcard-monto{font-size:15px;font-weight:800;color:var(--navy)}
.lcard-monto small{font-size:11px;color:var(--t3);font-weight:700}

/* ─── Estado badge / flow ─── */
.est{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:800;padding:4px 10px;border-radius:20px;letter-spacing:.02em;white-space:nowrap}
.est::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor}
.est-borrador{background:#f1f5f9;color:#64748b}
.est-preparacion{background:#e0e7ff;color:#4f46e5}
.est-publicada{background:#dbeafe;color:#2266b0}
.est-invitaciones{background:#cffafe;color:#0e7490}
.est-ofertas{background:#fef3c7;color:#b45309}
.est-evaluacion{background:#ede9fe;color:#7c3aed}
.est-adjudicacion{background:#fed7aa;color:#c2410c}
.est-contratada{background:#d1fae5;color:#0f7a54}
.est-cerrada{background:#e2e8f0;color:#475569}
.est-desierta{background:#fee2e2;color:#dc2626}
.prio{font-size:10px;font-weight:800;padding:2px 8px;border-radius:6px;text-transform:uppercase;letter-spacing:.04em}
.prio-alta{background:#fee2e2;color:#dc2626}.prio-media{background:#fef3c7;color:#b45309}.prio-baja{background:#e2e8f0;color:#64748b}

/* Flow steps */
.flow{display:flex;align-items:center;gap:0;flex-wrap:wrap;margin:6px 0 4px}
.flow-step{display:flex;align-items:center;gap:6px;font-size:10px;font-weight:700;color:var(--t3);padding:4px 0}
.flow-dot{width:20px;height:20px;border-radius:50%;background:#e2e8f0;color:#94a3b8;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;flex-shrink:0;border:2px solid transparent}
.flow-step.done .flow-dot{background:var(--teal);color:#fff}
.flow-step.current .flow-dot{background:#fff;color:var(--brand);border-color:var(--teal);box-shadow:0 0 0 3px rgba(62,203,176,.18)}
.flow-step.current{color:var(--navy)}
.flow-line{width:22px;height:2px;background:#e2e8f0}
.flow-line.done{background:var(--teal)}
@media(max-width:720px){.flow-line{width:10px}.flow-step span{display:none}}

/* ─── Detail ─── */
.detail-head{background:linear-gradient(135deg,var(--navy2),var(--navy) 60%,#142878);border-radius:16px;padding:20px 22px;color:#fff;margin-bottom:16px;position:relative;overflow:hidden}
.detail-head::after{content:'';position:absolute;top:-100px;right:-80px;width:340px;height:340px;border-radius:50%;background:radial-gradient(circle,rgba(62,203,176,.12),transparent 65%);pointer-events:none}
.dh-top{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;flex-wrap:wrap;position:relative;z-index:1}
.dh-cod{font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:600;color:var(--teal)}
.dh-name{font-size:22px;font-weight:800;margin-top:4px;letter-spacing:-.4px}
.dh-meta{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:10px;font-size:12.5px;color:rgba(255,255,255,.72);font-weight:600}
.dh-meta i{width:14px;height:14px;vertical-align:-2px;margin-right:4px;color:var(--teal)}
.dh-right{display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.dh-monto{text-align:right}
.dh-monto .v{font-size:22px;font-weight:800;letter-spacing:-.5px}
.dh-monto .l{font-size:10.5px;color:rgba(255,255,255,.5);font-weight:700;text-transform:uppercase;letter-spacing:.05em}

.dtabs{display:flex;gap:3px;overflow-x:auto;border-bottom:1px solid var(--bd);margin-bottom:18px;padding-bottom:0}
.dtab{border:none;background:transparent;font-size:13px;font-weight:700;color:var(--t2);padding:10px 14px;border-bottom:2.5px solid transparent;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;transition:.15s}
.dtab:hover{color:var(--navy)}
.dtab.active{color:var(--brand);border-bottom-color:var(--teal)}
.dtab .cnt{font-size:10.5px;font-weight:800;background:#f1f5f9;color:#64748b;padding:1px 6px;border-radius:20px}
.dtab.active .cnt{background:rgba(14,165,164,.12);color:#0a8f8e}

.panel{background:#fff;border:1px solid var(--bd);border-radius:14px;padding:18px 20px;box-shadow:0 1px 2px rgba(15,23,42,.05);margin-bottom:14px}
.panel-t{font-size:14px;font-weight:800;color:var(--navy);display:flex;align-items:center;gap:8px;margin-bottom:4px}
.panel-t i{width:16px;height:16px;color:var(--brand)}
.panel-d{font-size:12.5px;color:var(--t2);margin-bottom:14px;font-weight:500}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:820px){.grid2{grid-template-columns:1fr}}

/* Tables */
.tbl-wrap{overflow-x:auto;border:1px solid var(--bd);border-radius:12px}
table.tbl{border-collapse:separate;border-spacing:0;width:100%;font-size:12.5px;min-width:520px}
table.tbl th,table.tbl td{padding:10px 12px;border-bottom:1px solid var(--bd);text-align:left;vertical-align:middle}
table.tbl thead th{background:#f8fafc;font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:var(--t2);position:sticky;top:0}
table.tbl tbody tr:last-child td{border-bottom:none}
table.tbl tbody tr:hover td{background:#f8fafc}
table.tbl td.num,table.tbl th.num{text-align:right;font-variant-numeric:tabular-nums;font-family:'JetBrains Mono',monospace;font-weight:600}
table.tbl input{width:100%;border:1px solid var(--bd);border-radius:7px;padding:6px 8px;font-family:inherit;font-size:12.5px;background:#fff}
table.tbl input.num{text-align:right;font-family:'JetBrains Mono',monospace}
.trow-total td{background:#f8fafc;font-weight:800;color:var(--navy)}

/* validation dots */
.vdot{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--t2)}
.vdot .d{width:11px;height:11px;border-radius:50%;flex-shrink:0}
.v-ok{background:#10b981}.v-pend{background:#f59e0b}.v-fail{background:#ef4444}
.vpill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:800;padding:3px 9px;border-radius:20px}
.vpill.ok{background:#d1fae5;color:#0f7a54}.vpill.pend{background:#fef3c7;color:#b45309}.vpill.fail{background:#fee2e2;color:#dc2626}

/* empty / loading */
.empty{padding:40px 20px;text-align:center;color:var(--t3);font-weight:600;background:#fff;border:1px dashed var(--bd);border-radius:14px}
.empty i{width:34px;height:34px;display:block;margin:0 auto 10px;color:#cbd5e1}
.spinner{width:34px;height:34px;border:3px solid #e2e8f0;border-top-color:var(--teal);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}

/* timeline */
.tl{position:relative;padding-left:22px}
.tl::before{content:'';position:absolute;left:6px;top:4px;bottom:4px;width:2px;background:var(--bd)}
.tl-item{position:relative;padding:0 0 16px}
.tl-item:last-child{padding-bottom:0}
.tl-item::before{content:'';position:absolute;left:-19px;top:3px;width:10px;height:10px;border-radius:50%;background:var(--teal);border:2px solid #fff;box-shadow:0 0 0 2px var(--bd)}
.tl-a{font-size:13px;font-weight:800;color:var(--navy)}
.tl-d{font-size:12px;color:var(--t2);margin-top:1px}
.tl-m{font-size:11px;color:var(--t3);font-weight:600;margin-top:2px}

/* controls / filters */
.ctrls{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.ctrls input,.ctrls select{font-family:inherit;font-size:13px;height:38px;padding:0 12px;border:1px solid var(--bd);border-radius:10px;background:#fff;color:var(--navy);font-weight:600}
.ctrls input{min-width:220px}
.ctrls input:focus,.ctrls select:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px rgba(62,203,176,.15)}

/* ─── Modal / drawer ─── */
.ov{position:fixed;inset:0;background:rgba(9,15,30,.55);backdrop-filter:blur(3px);z-index:50;display:none;align-items:flex-start;justify-content:center;padding:28px 16px;overflow-y:auto}
.ov.on{display:flex}
.modal{background:#fff;border-radius:18px;width:100%;max-width:760px;box-shadow:0 30px 80px -20px rgba(9,15,30,.5);animation:pop .2s ease both;margin:auto}
.modal.wide{max-width:1080px}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
.modal-h{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid var(--bd)}
.modal-h-t{font-size:17px;font-weight:800}
.modal-h-s{font-size:12.5px;color:var(--t2);margin-top:2px;font-weight:500}
.modal-x{width:34px;height:34px;border-radius:9px;border:none;background:#f1f5f9;color:#475569;font-size:20px;display:flex;align-items:center;justify-content:center}
.modal-x:hover{background:#e2e8f0}
.modal-b{padding:20px 22px;max-height:70vh;overflow-y:auto}
.modal-f{display:flex;align-items:center;justify-content:flex-end;gap:10px;padding:16px 22px;border-top:1px solid var(--bd);background:#fbfcfe;border-radius:0 0 18px 18px}

/* forms */
.fsec{margin-bottom:18px}
.fsec-t{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--brand);margin-bottom:10px;display:flex;align-items:center;gap:7px}
.fsec-t i{width:14px;height:14px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fgrid .full{grid-column:1/-1}
@media(max-width:620px){.fgrid{grid-template-columns:1fr}}
.fg label{display:block;font-size:11.5px;font-weight:700;color:var(--t2);margin-bottom:5px}
.fg label .req{color:var(--red)}
.fg input,.fg select,.fg textarea{width:100%;font-family:inherit;font-size:13.5px;padding:9px 11px;border:1px solid var(--bd);border-radius:10px;background:#fff;color:var(--navy);font-weight:500}
.fg textarea{resize:vertical;min-height:64px}
.fg input:focus,.fg select:focus,.fg textarea:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px rgba(62,203,176,.15)}
.fhint{font-size:11px;color:var(--t3);margin-top:4px;font-weight:500}
.chip-add{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--brand);padding:7px 12px;border:1px dashed rgba(14,165,164,.4);border-radius:9px;background:rgba(14,165,164,.05)}
.chip-add:hover{background:rgba(14,165,164,.1)}

/* toast */
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--navy);color:#fff;padding:13px 20px;border-radius:12px;font-size:13.5px;font-weight:600;box-shadow:0 16px 40px -10px rgba(9,15,30,.5);z-index:100;opacity:0;transition:.25s;display:flex;align-items:center;gap:10px;pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.err{background:#c0453b}
.toast i{width:17px;height:17px}

/* score ring */
.ring{position:relative;width:56px;height:56px;flex-shrink:0}
.ring svg{transform:rotate(-90deg)}
.ring .rv{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800;color:var(--navy)}
.bar{height:8px;border-radius:6px;background:#eef2f7;overflow:hidden}
.bar > i{display:block;height:100%;border-radius:6px}

.pill-tabbtn{border:1px solid var(--bd);background:#fff;border-radius:9px;padding:7px 11px;font-size:12px;font-weight:700;color:var(--t2)}
.pill-tabbtn.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.diffpos{color:#0f7a54;font-weight:700}.diffneg{color:#c0453b;font-weight:700}
.badge-win{background:linear-gradient(135deg,#fde68a,#fbbf24);color:#7c2d12;font-size:10px;font-weight:800;padding:2px 8px;border-radius:6px;text-transform:uppercase;letter-spacing:.04em}

/* ══════════════ Rediseño ejecutivo · pantalla de lista (centro de control) ══════════════ */
#app{--l:#e9ecf1;--l2:#f1f3f7;--mut:#6b7280;--mut2:#9aa3b2}
.lc-head3{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;padding-bottom:20px;border-bottom:1px solid var(--l);margin-bottom:24px}
.lc-h1b{font-size:27px;font-weight:800;letter-spacing:-.8px;color:var(--navy);line-height:1}
.lc-subb{font-size:13.5px;color:var(--mut);font-weight:500;margin-top:7px}
.lc-actions2{display:flex;gap:10px}

/* Resumen ejecutivo — franja horizontal única */
.exec{display:flex;flex-wrap:wrap;background:var(--surf);border:1px solid var(--l);border-radius:14px;margin-bottom:14px;overflow:hidden}
.exec-item{flex:1;min-width:140px;padding:18px 22px;border-right:1px solid var(--l2);cursor:pointer;transition:background .14s;position:relative}
.exec-item:last-child{border-right:none}
.exec-item:hover{background:#fafbfc}
.exec-item.on{background:rgba(62,203,176,.07)}
.exec-item.on::after{content:'';position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--teal)}
.exec-n{font-size:32px;font-weight:700;letter-spacing:-1px;color:var(--navy);line-height:1;font-variant-numeric:tabular-nums;font-family:'JetBrains Mono',ui-monospace,monospace}
.exec-l{font-size:12px;font-weight:600;color:var(--mut);margin-top:9px;letter-spacing:.01em}
.exec-money{display:flex;align-items:center;gap:11px;flex-wrap:wrap;margin:0 2px 24px;font-size:13.5px;color:var(--mut);font-weight:500}
.exec-money b{color:var(--navy);font-weight:800}
.exec-money .sep{color:var(--mut2)}

/* Barra de alertas compacta */
.alertbar{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:22px}
.alert-chip{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;color:#475569;background:var(--surf);border:1px solid var(--l);border-radius:999px;padding:7px 14px;cursor:pointer;transition:.14s}
.alert-chip:hover{border-color:#cbd5e1;background:#fafbfc}
.alert-chip.on{color:#fff;border-color:var(--navy);background:var(--navy)}
.alert-chip .adot{width:7px;height:7px;border-radius:50%;flex-shrink:0;background:var(--mut2)}
.alert-chip.warn .adot,.alert-chip.warn2 .adot{background:var(--amber)}
.alert-chip.crit .adot{background:var(--red)}
.alert-chip.ok .adot{background:var(--green)}
.alert-chip.on .adot{background:#fff}
.alert-clear{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;color:var(--mut);background:none;border:none;cursor:pointer;padding:6px 8px}
.alert-clear:hover{color:var(--navy)}.alert-clear i{width:13px;height:13px}

/* Toolbar */
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.tb-search{position:relative;flex:1;min-width:200px;max-width:360px}
.tb-search i{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--mut2)}
.tb-search input{width:100%;height:38px;padding:0 12px 0 34px;border:1px solid var(--l);border-radius:10px;font-family:inherit;font-size:13px;font-weight:500;color:var(--navy);background:var(--surf)}
.tb-sel{height:38px;padding:0 12px;border:1px solid var(--l);border-radius:10px;font-family:inherit;font-size:12.5px;font-weight:600;color:#475569;background:var(--surf)}
.tb-search input:focus,.tb-sel:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px rgba(62,203,176,.14)}
.tb-count{margin-left:auto;font-size:12.5px;color:var(--mut);font-weight:600;font-variant-numeric:tabular-nums}

/* Lista ejecutiva — protagonista */
.ltable{background:var(--surf);border:1px solid var(--l);border-radius:14px;overflow:hidden;box-shadow:0 1px 2px rgba(15,23,42,.03)}
.lrow{display:grid;grid-template-columns:minmax(0,2.5fr) 1fr 1.5fr 1.15fr;gap:22px;align-items:center;padding:17px 22px;border-bottom:1px solid var(--l2);cursor:pointer;transition:background .12s}
.lrow:last-child{border-bottom:none}
.lrow:hover{background:#fafbfd}
.lrow-main{min-width:0}
.lrow-cod{font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:600;color:var(--mut2);letter-spacing:.02em}
.lrow-name{font-size:15.5px;font-weight:700;color:var(--navy);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.2px}
.lrow-meta{font-size:12.5px;color:var(--mut);font-weight:500;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lrow-monto{text-align:right;font-size:15.5px;font-weight:800;color:var(--navy);font-variant-numeric:tabular-nums;letter-spacing:-.3px;line-height:1.1}
.lrow-monto small{display:block;font-size:10.5px;font-weight:600;color:var(--mut2);letter-spacing:0;margin-top:3px;text-transform:none}
.lrow-prog{min-width:0}
.pbar{height:5px;border-radius:3px;background:var(--l);overflow:hidden}
.pbar>i{display:block;height:100%;border-radius:3px;background:var(--teal);transition:width .5s}
.pbar.warn>i{background:var(--amber)}
.pbar.crit>i{background:var(--red)}
.lrow-sub{display:flex;justify-content:space-between;gap:10px;margin-top:8px;font-size:11.5px;color:var(--mut);font-weight:600}
.lrow-sub .c-warn{color:var(--amber)}
.lrow-sub .c-crit{color:var(--red)}
.lrow-right{display:flex;justify-content:flex-end}
.pill2{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:700;color:#334155;background:#f3f5f8;border-radius:999px;padding:5px 12px;white-space:nowrap}
.pill2 .d{width:7px;height:7px;border-radius:50%;background:var(--mut2)}
.pill2.teal .d{background:var(--teal)}
.pill2.slate .d{background:#94a3b8}
.pill2.ok{color:#15803d;background:rgba(22,163,74,.09)}
.pill2.ok .d{background:var(--green)}
.pill2.crit{color:#b91c1c;background:rgba(220,38,38,.08)}
.pill2.crit .d{background:var(--red)}

@media(max-width:880px){
  .lrow{grid-template-columns:1fr auto;gap:12px 14px}
  .lrow-monto{text-align:left}
  .lrow-right{order:2;align-self:start}
  .lrow-prog{grid-column:1/-1;order:3}
}

// ══════════════ Helpers ══════════════
var $ = function(s,r){ return (r||document).querySelector(s); };
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function icons(){ if(window.lucide) lucide.createIcons(); }
function money(n,cur){ n=Number(n||0); var sym = cur==='USD'?'$':'S/ '; return sym + n.toLocaleString('es-PE',{maximumFractionDigits:0}); }
function moneyK(n,cur){ n=Number(n||0); var sym=cur==='USD'?'$':'S/ '; if(Math.abs(n)>=1000) return sym+(n/1000).toLocaleString('es-PE',{maximumFractionDigits:0})+'k'; return sym+n; }
function fmtDate(iso){ if(!iso) return '—'; try{ var d=new Date(iso); return d.toLocaleDateString('es-PE',{day:'2-digit',month:'short',year:'numeric'}); }catch(e){ return '—'; } }
function daysTo(iso){ if(!iso) return null; var t=new Date(); t.setHours(0,0,0,0); var d=new Date(iso); d.setHours(0,0,0,0); return Math.round((d-t)/86400000); }
function estClass(e){ return EST_CLASS[e]||'est-borrador'; }
function toast(msg,err){ var t=$('#toast'); if(!t) return; var tx=$('#toast-txt'); if(tx) tx.textContent=msg; t.classList.toggle('err',!!err); var ic=t.querySelector('i,svg'); if(ic&&ic.parentNode){ var ni=document.createElement('i'); ni.setAttribute('data-lucide',err?'alert-triangle':'check'); ic.parentNode.replaceChild(ni,ic); } icons(); t.classList.add('on'); clearTimeout(window.__tt); window.__tt=setTimeout(function(){t.classList.remove('on');},3200); }
function uniq(a){ return a.filter(function(v,i){ return v && a.indexOf(v)===i; }); }
function esc2(s){return esc(s);}

// ══════════════ Archivos (bucket privado lic-expediente · se abren con link firmado) ══════════════
var LIC_BUCKET='lic-expediente';
function safeName(n){ return String(n||'archivo').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^A-Za-z0-9._-]+/g,'_').slice(-120); }
function fmtBytes(b){ b=Number(b||0); if(!b) return ''; if(b<1048576) return Math.max(1,Math.round(b/1024))+' KB'; return (b/1048576).toFixed(1)+' MB'; }
function fFile(id,label,full,multiple){ return '<div class="fg'+(full?' full':'')+'"><label>'+label+'</label><input id="'+id+'" type="file"'+(multiple?' multiple':'')+' style="padding:8px"></div>'; }
async function uploadLicFile(licId, sub, file){
  var path=licId+'/'+sub+'/'+Date.now()+'-'+safeName(file.name);
  var up=await sb.storage.from(LIC_BUCKET).upload(path, file, { contentType:file.type||undefined, upsert:false });
  if(up.error) throw up.error;
  return path;
}
function fileBtn(path,label){ return '<button class="btn btn-sm" data-file="'+esc(path)+'" style="padding:4px 9px"><i data-lucide="download" style="width:13px;height:13px"></i>'+esc(label||'Descargar')+'</button>'; }
document.addEventListener('click', async function(ev){
  var b=ev.target.closest && ev.target.closest('[data-file]'); if(!b) return;
  ev.preventDefault();
  var w=window.open('about:blank','_blank'); // se abre antes del await para que el navegador no lo bloquee

var VALID_KEYS = [
  ['economica','Oferta económica'],['tecnica','Oferta técnica'],['formato','Formato obligatorio'],
  ['cronograma','Cronograma'],['garantias','Garantías'],['documentos','Documentación requerida']

async function boot(){
  if(!sb){ $('#app').innerHTML = errBox('Supabase no disponible'); return; }
  try{
    // Todas las consultas EN PARALELO (antes iban en serie → 3× más lento)
    var res = await Promise.all([
      sb.from('lic_licitaciones').select('*').order('created_at',{ascending:false}),
      sb.from('lic_adjudicaciones').select('licitacion_id,monto_adjudicado,contratista'),
      sb.from('lic_ofertas').select('licitacion_id,estado,validacion'),
      sb.from('lic_invitados').select('licitacion_id,contratista'),
      sb.from('lic_partidas').select('origen_presupuesto_id').not('origen_presupuesto_id','is',null),
      supsb ? supsb.from('v_partidas_licitables').select('*') : Promise.resolve({data:[]}),
      sb.from('lic_eventos').select('licitacion_id,detalle,created_at').eq('accion','Cambio de estado').order('created_at')
    ]);
    if(res[0].error) throw res[0].error;
    STATE.lics = res[0].data||[];
    STATE.adj = {}; (res[1].data||[]).forEach(function(a){ STATE.adj[a.licitacion_id]=a; });
    STATE.ofertasCount={}; STATE.docIncompleta={};
    (res[2].data||[]).forEach(function(o){ STATE.ofertasCount[o.licitacion_id]=(STATE.ofertasCount[o.licitacion_id]||0)+1; if(valState(o.validacion)!=='ok') STATE.docIncompleta[o.licitacion_id]=true; });
    STATE.invCount={}; STATE.invNames={}; (res[3].data||[]).forEach(function(i){ STATE.invCount[i.licitacion_id]=(STATE.invCount[i.licitacion_id]||0)+1; (STATE.invNames[i.licitacion_id]=STATE.invNames[i.licitacion_id]||[]).push(i.contratista||''); });
    STATE.cambios=res[6].data||[];
    STATE.licitadas={}; (res[4].data||[]).forEach(function(r){ if(r.origen_presupuesto_id!=null) STATE.licitadas[r.origen_presupuesto_id]=true; });
    STATE.partidasLic={}; STATE.manoObra={};
    (res[5].data||[]).forEach(function(r){ var k=normname(r.nombre_proyecto); (STATE.partidasLic[k]=STATE.partidasLic[k]||[]).push({presupuesto_id:r.presupuesto_id,proyecto:r.nombre_proyecto,item:r.item,descripcion:r.descripcion,unidad:r.unidad,cantidad:Number(r.cantidad||1),costo:Number(r.mano_obra_costo||0),venta:Number(r.mano_obra_venta||0),rubro:r.rubro||'Sin rubro',partida_cod:r.partida_cod||r.item,partida:r.partida||r.descripcion}); });
    // Orden por código de partida como texto: los EDT de NISIRA ("0003.001.002.014") no

    Object.keys(STATE.partidasLic).forEach(function(k){ var a=STATE.partidasLic[k]; a.sort(function(x,y){ return String(x.item).localeCompare(String(y.item),'es',{numeric:true}); }); STATE.manoObra[k]={proyecto:a[0].proyecto,costo:a.reduce(function(s,x){return s+x.costo;},0),venta:a.reduce(function(s,x){return s+x.venta;},0),partidas:a.length}; });
    STATE.real = { lics:STATE.lics, adj:STATE.adj, ofertasCount:STATE.ofertasCount, docIncompleta:STATE.docIncompleta, invCount:STATE.invCount, invNames:STATE.invNames, cambios:STATE.cambios };
    if(STATE.demo || /[?&]demo=1/.test(location.search)) setDemo(true); else renderHome();
  }catch(e){ console.error(e); $('#app').innerHTML = errBox(String(e.message||e)); }
}

// ══════════════ KPIs ══════════════
function computeKpis(){
  var L=STATE.lics;
  function isAdjudicada(l){ return !!STATE.adj[l.id] || l.estado==='Contratada' || l.estado==='Cerrada'; }
  var abiertas = L.filter(function(l){ return OPEN_STATES.indexOf(l.estado)>=0; });
  var enEval = L.filter(function(l){ return l.estado==='Evaluación'; });
  var pendAdj = L.filter(function(l){ return l.estado==='Adjudicación' && !STATE.adj[l.id]; });
  var adjudicadas = L.filter(isAdjudicada);
  var vencidas = L.filter(function(l){ var d=daysTo(l.fecha_limite); return d!==null && d<0 && !isAdjudicada(l) && l.estado!=='Cerrada' && l.estado!=='Desierta' && l.estado!=='Borrador'; });
  var enProceso = L.filter(function(l){ return !isAdjudicada(l) && l.estado!=='Cerrada' && l.estado!=='Desierta'; });
  var montoProceso = enProceso.reduce(function(s,l){ return s+Number(l.presupuesto_base||0); },0);
  var montoAdj = Object.values(STATE.adj).reduce(function(s,a){ return s+Number(a.monto_adjudicado||0); },0);
  // alertas
  var proxCierre = abiertas.filter(function(l){ var d=daysTo(l.fecha_limite); return d!==null && d>=0 && d<=7; });
  var pendEval = L.filter(function(l){ return (l.estado==='Ofertas'||l.estado==='Evaluación') && (STATE.ofertasCount[l.id]||0)>0; });
  var docInc = L.filter(function(l){ return STATE.docIncompleta[l.id]; });
  return { abiertas:abiertas.length, enEval:enEval.length, pendAdj:pendAdj.length, adjudicadas:adjudicadas.length,
    vencidas:vencidas.length, montoProceso:montoProceso, montoAdj:montoAdj,
    proxCierre:proxCierre.length, retraso:vencidas.length, pendEval:pendEval.length, docInc:docInc.length };
}

// ══════════════ VISTA: LISTA (centro de control) ══════════════
function isAdj(l){ return !!STATE.adj[l.id] || l.estado==='Contratada' || l.estado==='Cerrada'; }
function matchGroup(l,g){
  var d=daysTo(l.fecha_limite);
  switch(g){
    case 'activas':      return !isAdj(l) && ['Publicada','Invitaciones','Ofertas','Evaluación','Adjudicación'].indexOf(l.estado)>=0;
    case 'eval':         return l.estado==='Evaluación';
    case 'pendadj':      return l.estado==='Adjudicación' && !STATE.adj[l.id];
    case 'adjudicadas':  return isAdj(l);
    case 'porvencer':    return d!==null && d>=0 && d<=7 && OPEN_STATES.indexOf(l.estado)>=0;
    case 'vencidas':     return d!==null && d<0 && !isAdj(l) && ['Cerrada','Desierta','Borrador'].indexOf(l.estado)<0;
    case 'docinc':       return !!STATE.docIncompleta[l.id];
    default:             return true;
  }
}
function montoDe(l){ var a=STATE.adj[l.id]; return Number(a?a.monto_adjudicado:l.presupuesto_base)||0; }
function sortLics(arr){
  var s=STATE.sort||'cierre'; var a=arr.slice();
  if(s==='monto'){ a.sort(function(x,y){ return montoDe(y)-montoDe(x); }); }
  else if(s==='estado'){ a.sort(function(x,y){ return FLOW.indexOf(x.estado)-FLOW.indexOf(y.estado); }); }
  else { a.sort(function(x,y){ var dx=daysTo(x.fecha_limite), dy=daysTo(y.fecha_limite); if(dx===null&&dy===null) return 0; if(dx===null) return 1; if(dy===null) return -1; return dx-dy; }); }
  return a;
}
function moneyExec(n,cur){ n=Number(n||0); var s=cur==='USD'?'$':'S/ '; var a=Math.abs(n); var sign=n<0?'−':''; if(a>=1e6) return sign+s+(a/1e6).toFixed(2)+' M'; if(a>=1e3) return sign+s+Math.round(a/1e3)+' K'; return sign+s+a.toLocaleString('es-PE'); }
function execItem(g,n,label,active){
  return '<div class="exec-item'+(active===g?' on':'')+'" data-group="'+g+'">'+
    '<div class="exec-n">'+String(n).padStart(2,'0')+'</div>'+
    '<div class="exec-l">'+esc(label)+'</div></div>';
}
function alertChip(g,tone,text,active){
  return '<button class="alert-chip '+tone+(active===g?' on':'')+'" data-group="'+g+'"><span class="adot"></span>'+esc(text)+'</button>';
}

// Proyectos con PARTIDAS de mano de obra aún no licitadas
function pendientesLic(){
  var out=[];
  Object.keys(STATE.partidasLic).forEach(function(k){
    var pend=STATE.partidasLic[k].filter(function(pt){ return !STATE.licitadas[pt.presupuesto_id]; });
    if(pend.length){ out.push({ proyecto:STATE.partidasLic[k][0].proyecto, count:pend.length, total:STATE.partidasLic[k].length, costo:pend.reduce(function(s,x){return s+x.costo;},0) }); }
  });
  return out.sort(function(a,b){ return b.costo-a.costo; });
}

function licRow(l){
  var adj=STATE.adj[l.id];
  var d=daysTo(l.fecha_limite);
  var idx=FLOW.indexOf(l.estado); if(idx<0) idx=0;
  var pct=Math.round(idx/(FLOW.length-1)*100);
  var closed=['Cerrada','Desierta'].indexOf(l.estado)>=0;
  var overdue = d!==null && d<0 && !isAdj(l) && !closed;
  var soon = d!==null && d>=0 && d<=7 && OPEN_STATES.indexOf(l.estado)>=0;
  var progCls = overdue?'crit':(soon?'warn':'');
  var cierre = d===null?'sin cierre':(isAdj(l)?'adjudicada':(d<0?Math.abs(d)+'d vencida':d+'d al cierre'));
  var cierreCls = overdue?'c-crit':(soon?'c-warn':'');
  var inv=STATE.invCount[l.id]||0, of=STATE.ofertasCount[l.id]||0;
  var isA=isAdj(l);
  var estLabel=adj?'Adjudicada':l.estado;
  var tone=isA?'ok':(l.estado==='Desierta'?'crit':(['Borrador','Preparación'].indexOf(l.estado)>=0?'slate':'teal'));
  return '<div class="lrow" data-lic="'+l.id+'">'+
    '<div class="lrow-main">'+
      '<div class="lrow-cod">'+esc(l.codigo)+'</div>'+
      '<div class="lrow-name">'+esc(l.nombre)+'</div>'+
      '<div class="lrow-meta">'+esc(l.proyecto||l.cliente||'—')+'  ·  '+esc(l.especialidad||'—')+'  ·  '+esc(l.ubicacion||l.zona||'—')+'</div>'+

function metricas(lics){

function tiemposEtapa(lics){

    var L=ids[id], ev=porLic[id].slice().sort(function(a,b){ return new Date(a.created_at)-new Date(b.created_at); });
    var estado='Borrador', desde=new Date(L.created_at||L.fecha_creacion);
    ev.forEach(function(e){
      var partes=String(e.detalle||'').split('→'); var to=(partes[1]||'').trim(); if(!to) return;
      var t=new Date(e.created_at), dias=Math.max(0,(t-desde)/86400000);

  var ESP={ 'Obras civiles':'Civil','Cámaras de frío':'Refrigeración','Sistema eléctrico':'Eléctrica','Movimiento de tierras':'Civil','Instalación sanitaria':'Sanitaria','Montaje de paneles':'Montaje','Hermetizado de túneles':'Montaje','Estructura metálica':'Estructuras','Instalación de puertas rápidas':'Montaje','Red contra incendio':'Sanitaria','Montaje de evaporadores':'Refrigeración','Losa de piso térmico':'Civil' };
  // [nº, estado, obra, trabajo, monto, días desde creación, días al cierre, adjudicada?]
  var spec=[
    [37,'Evaluación',0,0,2500000,-24,14],[36,'Ofertas',1,1,1800000,-18,9],[35,'Adjudicación',2,2,950000,-30,4],[34,'Contratada',3,3,3200000,-45,-1,1],[33,'Invitaciones',4,4,620000,-10,12],
    [32,'Ofertas',5,5,1450000,-16,6],[31,'Publicada',6,6,780000,-6,21],[30,'Evaluación',7,7,2100000,-28,-3],[29,'Invitaciones',0,8,540000,-9,15],[28,'Contratada',1,9,1250000,-60,-20,1],
    [27,'Evaluación',2,10,1980000,-33,-6],[26,'Ofertas',3,11,2350000,-20,3],[25,'Adjudicación',4,0,1320000,-38,-2],[24,'Contratada',5,1,880000,-70,-35,1],[23,'Desierta',6,2,410000,-80,-40],
    [22,'Borrador',7,3,1650000,-2,30],[21,'Contratada',0,4,1140000,-90,-55,1],[20,'Publicada',1,5,720000,-5,24],[19,'Evaluación',2,6,1580000,-35,-8],[18,'Adjudicación',3,7,900000,-41,-5],
    [17,'Contratada',4,8,2050000,-110,-70,1],[16,'Cerrada',5,9,600000,-120,-80],[15,'Contratada',6,10,1300000,-130,-95,1],[14,'Desierta',7,11,350000,-140,-100],[13,'Contratada',0,0,1010000,-150,-120,1],
    [12,'Preparación',1,1,1480000,-3,26],[11,'Cerrada',2,2,520000,-160,-130],[10,'Contratada',3,3,1750000,-170,-140,1],[9,'Ofertas',4,4,690000,-14,8]
  ];
  var lics=[], adj={}, ofertas={}, invCount={}, invNames={}, cambios=[];
  spec.forEach(function(x){
    var id='demo-'+x[0], ob=OBRAS[x[2]], tr=TRAB[x[3]], creado=dia(x[5]);
    var l={ id:id, codigo:'LIC-'+hoy.getFullYear()+'-'+String(x[0]).padStart(3,'0'), nombre:tr+' – '+ob[0].replace('Expansión ','').replace('Planta ','Planta '), proyecto:ob[0], cliente:ob[2], zona:ob[1], especialidad:ESP[tr], estado:x[1], moneda:'PEN', presupuesto_base:x[4], fecha_creacion:iso(creado), created_at:creado.toISOString(), fecha_limite:iso(dia(x[6])), responsable:'Carlos Vega' };
    lics.push(l);
    var nInv=2+Math.floor(rnd()*4); var nombres=[]; for(var i=0;i<nInv;i++){ nombres.push(EMP[(x[0]*3+i*2)%EMP.length]); }
    nombres=uniq(nombres); invNames[id]=['Borrador','Preparación'].indexOf(x[1])>=0?[]:nombres; invCount[id]=invNames[id].length;
    var idx=FLOW.indexOf(x[1]);
    if(idx>=FLOW.indexOf('Ofertas') || x[1]==='Desierta') ofertas[id]=x[1]==='Desierta'?0:Math.max(1,nombres.length-1);
    if(x[7]){ adj[id]={ licitacion_id:id, contratista:nombres[0], monto_adjudicado:Math.round(x[4]*(0.9+rnd()*0.06)/1000)*1000 }; }
    // cambios de estado con duraciones creíbles por etapa
    var dur={ 'Borrador':2+rnd()*2, 'Preparación':1+rnd()*1.5, 'Publicada':3+rnd()*3, 'Invitaciones':4+rnd()*4, 'Ofertas':12+rnd()*5, 'Evaluación':15+rnd()*6, 'Adjudicación':5+rnd()*3, 'Contratada':6 };
    var destino = x[1]==='Desierta' ? FLOW.indexOf('Evaluación') : (x[1]==='Cerrada' ? FLOW.indexOf('Evaluación') : idx);
    var t=new Date(creado);
    for(var k=0;k<destino;k++){ t=new Date(t.getTime()+dur[FLOW[k]]*86400000); cambios.push({ licitacion_id:id, detalle:FLOW[k]+' → '+FLOW[k+1], created_at:t.toISOString() }); }
    if(x[1]==='Desierta' || x[1]==='Cerrada'){ t=new Date(t.getTime()+dur['Evaluación']*86400000); cambios.push({ licitacion_id:id, detalle:'Evaluación → '+x[1], created_at:t.toISOString() }); }
  });
  // año anterior, para que los indicadores muestren la comparación
  for(var j=1;j<=14;j++){
    var id='demo-p'+j, c=new Date(hoy.getFullYear()-1, (j*5)%12, 5+j), gana=j%2===0, monto=700000+((j*337)%9)*150000;

    invNames[id]=[EMP[j%EMP.length],EMP[(j+4)%EMP.length]]; invCount[id]=2; ofertas[id]=2;
    if(gana && j%5!==0) adj[id]={ licitacion_id:id, contratista:EMP[j%EMP.length], monto_adjudicado:Math.round(monto*0.93) };
  }
  return { lics:lics, adj:adj, ofertas:ofertas, invCount:invCount, invNames:invNames, cambios:cambios };
}

async function ensureRefs(){
  if(STATE.contratistas.length && STATE.proyectos.length) return;
  try{
    var ps = await sb.from('proyectos').select('id,nombre,cod_proyecto,estado,supervisor,supervisor_email,zona,categoria,departamento,provincia,distrito,direccion,ambientes,fecha_ini_contractual,fecha_fin_contractual,venta,valorizacion_pct').order('nombre');
    var rows = ps.data||[];
    STATE.proyectos = uniq(rows.map(function(p){ return p.nombre; }));
    STATE.proyectosByName = {};
    rows.forEach(function(p){ if(p.nombre && !STATE.proyectosByName[p.nombre]) STATE.proyectosByName[p.nombre]=p; });
  }catch(e){ STATE.proyectos=[]; STATE.proyectosByName={}; }
  try{
    var cs = await sb.from('portafolio_servicios').select('contratista,especialidad,supervisor');
    var map={};
    (cs.data||[]).forEach(function(r){ var n=(r.contratista||'').trim(); if(!n) return; if(!map[n]) map[n]={nombre:n,especialidad:r.especialidad||'',n:0}; map[n].n++; });
    STATE.contratistas = Object.values(map).sort(function(a,b){ return b.n-a.n; });
  }catch(e){ STATE.contratistas=[]; }
}

          '<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 12px;background:#f8fafc;font-size:12px;flex-wrap:wrap">'+
            '<span style="font-weight:700"><a href="#" id="nc-pt-all" style="color:#0ea5a4;text-decoration:none">Todas</a> · <a href="#" id="nc-pt-none" style="color:#94a3b8;text-decoration:none">Ninguna</a></span>'+
            '<span style="font-weight:800">Presupuesto: <span id="nc-pt-total"></span></span>'+
          '</div></div>';
        function tri(box, sel){
          var kids=document.querySelectorAll(sel+':not(:disabled)');
          var on=0; kids.forEach(function(k){ if(k.checked) on++; });
          box.checked = kids.length>0 && on===kids.length;
          box.indeterminate = on>0 && on<kids.length;
        }
        function syncGroups(){
          document.querySelectorAll('.nc-part-chk').forEach(function(p){
            tri(p, '.nc-pt[data-p="'+p.getAttribute('data-p')+'"]');
          });
          document.querySelectorAll('.nc-grp-chk').forEach(function(g){
            tri(g, '.nc-pt[data-g="'+g.getAttribute('data-g')+'"]');
          });
        }
        function recompute(){
          var tot=0,n=0,parts={};
          document.querySelectorAll('.nc-pt:checked').forEach(function(cb){
            tot+=Number(cb.getAttribute('data-costo')||0); n++; parts[cb.getAttribute('data-p')]=1;
          });
          var np=Object.keys(parts).length;
          var t=$('#nc-pt-total');
          if(t) t.textContent=money(tot,MON)+' · '+np+' partida'+(np===1?'':'s')+' ('+n+' ítems)';
          var pr=$('#nc-pres'); if(pr) pr.value=Math.round(tot);
          syncGroups();
        }
        document.querySelectorAll('.nc-pt').forEach(function(cb){ cb.onchange=recompute; });
        document.querySelectorAll('.nc-part-chk').forEach(function(p){
          p.onchange=function(){ document.querySelectorAll('.nc-pt[data-p="'+p.getAttribute('data-p')+'"]:not(:disabled)').forEach(function(k){ k.checked=p.checked; }); recompute(); };
        });
        document.querySelectorAll('.nc-grp-chk').forEach(function(g){
          g.onchange=function(){ document.querySelectorAll('.nc-pt[data-g="'+g.getAttribute('data-g')+'"]:not(:disabled)').forEach(function(k){ k.checked=g.checked; }); recompute(); };
        });
        document.querySelectorAll('.nc-part-tog').forEach(function(a){
          a.onclick=function(e){ e.preventDefault();
            var box=document.querySelector('.nc-part-items[data-p="'+a.getAttribute('data-p')+'"]');
            if(!box) return; box.hidden=!box.hidden; a.textContent = box.hidden ? 'ver ítems' : 'ocultar';
          };
        });
        var a1=$('#nc-pt-all'); if(a1) a1.onclick=function(e){ e.preventDefault(); document.querySelectorAll('.nc-pt:not(:disabled)').forEach(function(cb){ cb.checked=true; }); recompute(); };
        var a3=$('#nc-pt-none'); if(a3) a3.onclick=function(e){ e.preventDefault(); document.querySelectorAll('.nc-pt').forEach(function(cb){ cb.checked=false; }); recompute(); };
        recompute();
      }
      function fill(){
        var name=sel.value; var info=$('#nc-proyinfo');
        var mo = name ? STATE.manoObra[normname(name)] : null;
        STATE.selProyecto = name ? ((STATE.proyectosByName&&STATE.proyectosByName[name])||null) : null;
        var p=STATE.selProyecto;
        if(!name){ if(info) info.innerHTML=''; renderPartidasPicker(''); return; }
        function setV(id,v){ var el=$('#'+id); if(el) el.value=(v==null?'':v); }
        var ubic='';
        if(p){
          var _seen={}; ubic=[p.distrito,p.provincia,p.departamento].filter(Boolean).filter(function(x){ var k=String(x).toLowerCase(); if(_seen[k]) return false; _seen[k]=1; return true; }).join(', ');
          setV('nc-cliente', p.nombre);
          setV('nc-ubic', ubic||p.direccion||p.zona||'');
          if(p.categoria) setV('nc-esp', p.categoria);
          if(p.fecha_ini_contractual) setV('nc-fini', p.fecha_ini_contractual);
          if(p.fecha_ini_contractual && p.fecha_fin_contractual){ var dd=Math.round((new Date(p.fecha_fin_contractual)-new Date(p.fecha_ini_contractual))/86400000); if(dd>0) setV('nc-plazo', dd); }
        } else { setV('nc-cliente', name); }
        if(info){ info.innerHTML=proyInfoHtml(p,ubic,mo); icons(); }
        renderPartidasPicker(name);
      }
      sel.onchange=fill;
      // Los montos del selector se muestran en la moneda elegida; NISIRA viene en dólares.
      var mo=$('#nc-moneda'); if(mo) mo.addEventListener('change', function(){ renderPartidasPicker(sel.value); });
      if(prefill){
        var exists=Array.prototype.some.call(sel.options,function(o){ return o.value===prefill; });
        if(!exists){ var op=document.createElement('option'); op.value=prefill; op.textContent=prefill; sel.appendChild(op); }
        sel.value=prefill; fill();
      }
    }
  });
}
async function doCreate(){
  var nombre=$('#nc-nombre').value.trim();
  if(!nombre){ toast('El nombre es obligatorio', true); return false; }
  var payload={
    codigo:$('#nc-cod').value.trim(), nombre:nombre,
    proyecto:$('#nc-proyecto').value||null, proyecto_id:(STATE.selProyecto&&STATE.selProyecto.id)||null, cliente:$('#nc-cliente').value.trim()||null,
    ubicacion:$('#nc-ubic').value.trim()||null, especialidad:$('#nc-esp').value.trim()||null,
    responsable:$('#nc-resp').value.trim()||USER, prioridad:$('#nc-prio').value,
    moneda:$('#nc-moneda').value, presupuesto_base:Number($('#nc-pres').value||0),
    fecha_limite:$('#nc-flim').value||null, fecha_inicio_req:$('#nc-fini').value||null,
    plazo_dias:$('#nc-plazo').value?Number($('#nc-plazo').value):null,
    alcance_desc:$('#nc-alcance').value.trim()||null, exclusiones:$('#nc-excl').value.trim()||null,
    entregables:$('#nc-entreg').value.trim()||null, estado:'Borrador'

    var partidas=[];
    document.querySelectorAll('.nc-pt').forEach(function(cb){ if(cb.checked){ var cant=Number(cb.getAttribute('data-cant')||1)||1; var costo=Number(cb.getAttribute('data-costo')||0); partidas.push({ codigo:cb.getAttribute('data-item'), descripcion:cb.getAttribute('data-desc'), unidad:cb.getAttribute('data-und')||null, cantidad:cant, pu_base:(cant?Math.round((costo/cant)*100)/100:costo), origen_presupuesto_id:Number(cb.getAttribute('data-pid')) }); } });
    if(partidas.length){ await sb.from('lic_partidas').insert(partidas.map(function(pt,i){ pt.licitacion_id=r.data.id; pt.orden=i+1; return pt; })); }
    await logEvento(r.data.id,'Creación','Licitación creada: '+payload.nombre+(partidas.length?(' · '+partidas.length+' partidas'):''));
    closeModal(); toast('Licitación creada'); await boot(); openDetail(r.data.id);
  }catch(e){ toast('Error: '+(e.message||e), true); return false; }

async function openDetail(id){
  if(STATE.demo){ toast('Es una licitación de ejemplo: no tiene detalle. Sal del modo ejemplo para trabajar con las reales.', true); return; }
  STATE.view='detail'; STATE.tab=STATE.tab||'resumen';
  var app=$('#app'); app.innerHTML='<div style="text-align:center;padding:80px 20px"><div class="spinner"></div><div style="color:#94a3b8;font-weight:600">Cargando licitación…</div></div>';
  try{
    // Lote 1: todo lo que no depende de otra consulta, EN PARALELO
    var b = await Promise.all([
      sb.from('lic_licitaciones').select('*').eq('id',id).single(),
      sb.from('lic_partidas').select('*').eq('licitacion_id',id).order('orden'),
      sb.from('lic_documentos').select('*').eq('licitacion_id',id).order('created_at'),
      sb.from('lic_planos').select('*').eq('licitacion_id',id).order('created_at'),
      sb.from('lic_plano_versiones').select('*').order('created_at'),
      sb.from('lic_invitados').select('*').eq('licitacion_id',id).order('invitado_at'),
      sb.from('lic_consultas').select('*').eq('licitacion_id',id).order('created_at'),
      sb.from('lic_adendas').select('*').eq('licitacion_id',id).order('numero'),
      sb.from('lic_ofertas').select('*').eq('licitacion_id',id).order('created_at'),
      sb.from('lic_adjudicaciones').select('*').eq('licitacion_id',id).maybeSingle(),
      sb.from('lic_eventos').select('*').eq('licitacion_id',id).order('created_at',{ascending:false})
    ]);
    var cur={ lic:b[0].data, partidas:b[1].data||[], docs:b[2].data||[], planos:b[3].data||[], planoVers:b[4].data||[], invitados:b[5].data||[], consultas:b[6].data||[], adendas:b[7].data||[], ofertas:b[8].data||[], adj:b[9].data, eventos:b[10].data||[] };
    // Lote 2: lo que sí depende (items de oferta, facturas del contrato) — también en paralelo
    var ofIds = cur.ofertas.map(function(o){ return o.id; });
    var b2 = await Promise.all([
      ofIds.length ? sb.from('lic_oferta_items').select('*').in('oferta_id',ofIds) : Promise.resolve({data:[]}),
      (cur.adj && cur.adj.contrato_codigo && ctsb) ? ctsb.rpc('contrato_ejecucion', { p_contrato: cur.adj.contrato_codigo }) : Promise.resolve({data:[]}),
      ensureCuentas()
    ]);
    cur.ofItems = b2[0].data||[];
    cur.facturas = (b2[1].data||[]).slice().sort(function(a,c){ return new Date(c.fecha)-new Date(a.fecha); });
    STATE.cur=cur;
    renderDetail();
  }catch(e){ console.error(e); app.innerHTML=errBox(String(e.message||e)); }
}

function flowBig(estado){
  var idx=FLOW.indexOf(estado); if(idx<0) idx=0;
  var short={'Borrador':'Borrador','Preparación':'Prep.','Publicada':'Publ.','Invitaciones':'Invit.','Ofertas':'Ofertas','Evaluación':'Eval.','Adjudicación':'Adjud.','Contratada':'Contrato','Cerrada':'Cerrada'};
  var h='<div class="flow">';
  FLOW.forEach(function(s,i){
    var cls = i<idx?'done':(i===idx?'current':'');
    h+='<div class="flow-step '+cls+'" style="color:'+(i<=idx?'rgba(255,255,255,.9)':'rgba(255,255,255,.4)')+'">'+
        '<span class="flow-dot" '+(i<idx?'':'')+'>'+(i<idx?'✓':(i+1))+'</span><span>'+short[s]+'</span></div>';
    if(i<FLOW.length-1) h+='<div class="flow-line '+(i<idx?'done':'')+'"></div>';
  });
  return h+'</div>';
}

async function openInvite(){
  await Promise.all([ensureRefs(), ensureCuentas()]);
  var L=STATE.cur.lic;
  var ya=STATE.cur.invitados.map(function(v){ return normname(v.email); });
  // especialidad y obras previas desde la cartera (portafolio_servicios), cruzando por nombre o alias
  var porNombre={}; STATE.contratistas.forEach(function(x){ porNombre[normname(x.nombre)]=x; });
  var lista=(STATE.cuentas||[]).filter(function(c){ return ya.indexOf(normname(c.email))<0; }).map(function(c){
    var nombres=[c.empresa].concat(Array.isArray(c.aliases)?c.aliases:[]);
    var hit=null; nombres.some(function(n){ hit=porNombre[normname(n)]; return !!hit; });
    var esp=(Array.isArray(c.especialidades)&&c.especialidades.length)?c.especialidades.join(', '):(hit?hit.especialidad:'');
    return { email:c.email, empresa:c.empresa, encargado:c.encargado, esp:esp||'', obras:hit?hit.n:0, homol:c.homologacion_estado||'Pendiente', vence:c.homologacion_vence };
  }).sort(function(a,b){ return homolOk(b)-homolOk(a) || b.obras-a.obras || a.empresa.localeCompare(b.empresa); });
  function homolOk(x){ return (x.homol==='Homologado' && !(x.vence && daysTo(x.vence)<0))?1:0; }
  var SEL={};
  function homolChip(x){
    var venc=x.vence && daysTo(x.vence)<0;
    if(x.homol==='Homologado' && !venc) return '<span style="font-size:10.5px;font-weight:800;color:#0d7d70;background:#e6f7f3;padding:2px 8px;border-radius:20px;white-space:nowrap">Homologado</span>';
    if(venc) return '<span style="font-size:10.5px;font-weight:800;color:#b91c1c;background:#fdecea;padding:2px 8px;border-radius:20px;white-space:nowrap">Homologación vencida</span>';
    return '<span style="font-size:10.5px;font-weight:800;color:#92400e;background:#fef3c7;padding:2px 8px;border-radius:20px;white-space:nowrap">'+esc(x.homol)+'</span>';
  }
  function rows(q){
    q=normname(q); var esp=normname(L.especialidad);
    var f=lista.filter(function(x){ return !q || normname(x.empresa+' '+x.email+' '+x.esp+' '+(x.encargado||'')).indexOf(q)>=0; });

    return f.map(function(x){
      var match=esp && x.esp && normname(x.esp).indexOf(esp)>=0;
      return '<label style="display:flex;align-items:center;gap:10px;padding:9px 12px;border-bottom:1px solid var(--bd);cursor:pointer">'+
        '<input type="checkbox" data-inv-email="'+esc(x.email)+'"'+(SEL[x.email]?' checked':'')+' style="width:16px;height:16px;flex-shrink:0">'+
        '<div style="flex:1;min-width:0"><div style="font-size:13px;font-weight:800;color:#0f1e35">'+esc(x.empresa)+(match?' <span style="font-size:10px;font-weight:800;color:#0d7d70">· misma especialidad</span>':'')+'</div>'+
        '<div style="font-size:11.5px;color:#64748b;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+esc(x.email)+(x.esp?' · '+esc(x.esp):'')+(x.obras?' · '+x.obras+' obra'+(x.obras>1?'s':'')+' con Friopacking':'')+'</div></div>'+
        homolChip(x)+
      '</label>';
    }).join('');
  }
  openModal({ title:'Invitar contratistas', sub:'Elige empresas con cuenta en el portal. La licitación les aparece al entrar.', wide:true,
    body:'<div class="fgrid">'+
      '<div class="fg full"><label>Buscar empresa, correo o especialidad</label><input id="iv-q" type="text" placeholder="Ej. refrigeración, Metalfresh…"></div>'+
      '<div class="fg full"><div id="iv-list" style="border:1px solid var(--bd);border-radius:11px;max-height:340px;overflow:auto">'+rows('')+'</div>'+

// ═════ Tab: Comparador ═════
function tabComparador(){
  var c=STATE.cur, cur=c.lic.moneda;
  if(!c.partidas.length) return '<div class="empty"><i data-lucide="table-2"></i>Agrega partidas (formato único) para habilitar el comparador.</div>';
  if(!c.ofertas.length) return '<div class="empty"><i data-lucide="columns-3"></i>Aún no hay ofertas para comparar.</div>';
  var ofs=c.ofertas;
  // matriz partida × oferta
  function puOf(ofId,pid){ var it=c.ofItems.find(function(x){return x.oferta_id===ofId && x.partida_id===pid;}); return it?Number(it.pu||0)*Number(it.cantidad!=null?it.cantidad:1):null; }
  var rows=c.partidas.map(function(p){
    var base=Number(p.cantidad||0)*Number(p.pu_base||0);
    var cells=ofs.map(function(o){
      var val=puOf(o.id,p.id);
      if(val===null) return '<td class="num" style="color:#dc2626;font-weight:700">omitida</td>';
      var diff=val-base; var cls=diff>0?'diffneg':(diff<0?'diffpos':'');
      return '<td class="num"><div>'+money(val,cur)+'</div><div style="font-size:10px" class="'+cls+'">'+(diff>0?'+':'')+money(diff,cur)+'</div></td>';
    }).join('');
    return '<tr><td class="rh" style="font-weight:700">'+esc(p.codigo)+' · '+esc(p.descripcion)+'</td><td class="num" style="color:#64748b">'+money(base,cur)+'</td>'+cells+'</tr>';
  }).join('');
  var base=c.partidas.reduce(function(s,p){return s+Number(p.cantidad||0)*Number(p.pu_base||0);},0);
  var totals=ofs.map(function(o){
    var diff=Number(o.monto_total)-base; var pct= base? (diff/base*100):0;
    var cls=diff>0?'diffneg':(diff<0?'diffpos':'');
    return '<td class="num"><div style="font-size:14px;font-weight:800">'+money(o.monto_total,cur)+'</div><div style="font-size:10.5px" class="'+cls+'">'+(diff>0?'+':'')+pct.toFixed(1)+'%</div></td>';
  }).join('');
  // anomalías: oferta > +15% o < -15% del presupuesto
  var anom=ofs.filter(function(o){ var pct=base?((o.monto_total-base)/base*100):0; return Math.abs(pct)>15; });
  var minOf=ofs.reduce(function(m,o){return (!m||o.monto_total<m.monto_total)?o:m;},null);
  return (anom.length?'<div style="background:#fffbeb;border:1px solid #fde68a;border-radius:12px;padding:12px 15px;margin-bottom:14px;font-size:12.5px;color:#92400e;font-weight:600"><i data-lucide="alert-triangle" style="width:15px;height:15px;vertical-align:-2px"></i> '+anom.length+' oferta(s) con desviación anómala (>15% vs presupuesto): '+anom.map(function(o){return esc(o.contratista);}).join(', ')+'</div>':'')+
    '<div class="panel"><div class="panel-t"><i data-lucide="columns-3"></i>Comparador de ofertas · vs presupuesto base</div>'+
    '<div class="panel-d">Precio por partida y total. Verde = por debajo del presupuesto · rojo = por encima. La oferta más baja se resalta.</div>'+
    '<div class="tbl-wrap"><table class="tbl" style="min-width:640px"><thead><tr><th class="rh" style="position:sticky;left:0;background:#f8fafc">Partida</th><th class="num">Presupuesto</th>'+
      ofs.map(function(o){ var win=minOf&&o.id===minOf.id; return '<th class="num">'+esc(o.contratista)+(win?' <span class="badge-win">↓ menor</span>':'')+'</th>'; }).join('')+'</tr></thead>'+
    '<tbody>'+rows+'</tbody>'+
    '<tfoot><tr class="trow-total"><td class="rh" style="text-align:right;background:#f1f5f9">TOTAL</td><td class="num">'+money(base,cur)+'</td>'+totals+'</tr></tfoot>'+
    '</table></div></div>';
}

// ═════ Tab: Evaluación (multicriterio) ═════
function tabEvaluacion(){
  var c=STATE.cur, L=c.lic;
  if(!c.ofertas.length) return '<div class="empty"><i data-lucide="scale"></i>Sin ofertas para evaluar.</div>';
  var wt=Number(L.peso_tecnica), we=Number(L.peso_economica), wp=Number(L.peso_performance);
  // ordenar por score_total
  var ofs=c.ofertas.slice().sort(function(a,b){ return (Number(b.score_total||0))-(Number(a.score_total||0)); });
  return '<div class="panel">'+
    '<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px"><div>'+
    '<div class="panel-t"><i data-lucide="sliders-horizontal"></i>Pesos de evaluación</div>'+
    '<div class="panel-d" style="margin:0">Configurables. Deben sumar 100%.</div></div>'+
    '<button class="btn btn-sm" id="edit-pesos"><i data-lucide="settings-2"></i>Editar pesos</button></div>'+
    '<div style="display:flex;gap:20px;margin-top:6px;flex-wrap:wrap">'+
      pesoBox('Técnica',wt,'#3b82f6')+pesoBox('Económica',we,'#0ea5a4')+pesoBox('Performance',wp,'#8b5cf6')+
    '</div></div>'+
    '<div class="secttl"><i data-lucide="scale" style="width:14px;height:14px"></i>Scoring por contratista</div>'+
    ofs.map(function(o,i){
      var st=Number(o.score_total||0);
      return '<div class="panel" style="padding:16px 18px;'+(i===0?'border:1.5px solid var(--teal)':'')+'">'+
        '<div style="display:flex;align-items:center;gap:16px;flex-wrap:wrap">'+
          scoreRing(st)+
          '<div style="flex:1;min-width:180px"><div style="font-size:15px;font-weight:800;color:#0f1e35">'+esc(o.contratista)+(i===0?' <span class="badge-win">mejor puntaje</span>':'')+'</div>'+
          '<div style="display:flex;gap:16px;margin-top:8px;flex-wrap:wrap">'+
            scoreBar('Técnica',o.score_tecnica,'#3b82f6')+scoreBar('Económica',o.score_economica,'#0ea5a4')+scoreBar('Performance',o.score_performance,'#8b5cf6')+
          '</div></div>'+
          '<button class="btn btn-sm" data-score="'+o.id+'"><i data-lucide="edit-3"></i>Editar puntaje</button>'+
        '</div>'+
      '</div>';
    }).join('');
}
window.bind_evaluacion=function(){
  var e=$('#edit-pesos'); if(e) e.onclick=openEditPesos;
  document.querySelectorAll('[data-score]').forEach(function(b){ b.onclick=function(){ openScore(b.getAttribute('data-score')); }; });
};
function pesoBox(l,v,col){ return '<div><div style="font-size:26px;font-weight:800;color:'+col+'">'+v+'%</div><div style="font-size:11px;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:.04em">'+l+'</div></div>'; }
function scoreRing(v){ v=Math.max(0,Math.min(100,Number(v||0))); var r=24,circ=2*Math.PI*r,off=circ*(1-v/100); var col=v>=85?'#10b981':(v>=70?'#0ea5a4':(v>=55?'#f59e0b':'#ef4444')); return '<div class="ring"><svg width="56" height="56"><circle cx="28" cy="28" r="24" fill="none" stroke="#eef2f7" stroke-width="6"/><circle cx="28" cy="28" r="24" fill="none" stroke="'+col+'" stroke-width="6" stroke-linecap="round" stroke-dasharray="'+circ+'" stroke-dashoffset="'+off+'"/></svg><div class="rv">'+Math.round(v)+'</div></div>'; }
function scoreBar(l,v,col){ v=Number(v||0); return '<div style="min-width:120px"><div style="font-size:10.5px;font-weight:700;color:#64748b;display:flex;justify-content:space-between"><span>'+l+'</span><span style="color:'+col+';font-weight:800">'+(v||'—')+'</span></div><div class="bar" style="margin-top:3px"><i style="width:'+Math.min(100,v)+'%;background:'+col+'"></i></div></div>'; }
function openEditPesos(){
  var L=STATE.cur.lic;
  openModal({ title:'Editar pesos de evaluación', sub:'Deben sumar 100%.',
    body:'<div class="fgrid">'+fInput('pw-t','Técnica (%)',L.peso_tecnica,'number')+fInput('pw-e','Económica (%)',L.peso_economica,'number')+fInput('pw-p','Performance (%)',L.peso_performance,'number')+'</div>',
    okText:'Guardar', ok: async function(){
      var t=Number($('#pw-t').value||0),e=Number($('#pw-e').value||0),p=Number($('#pw-p').value||0);
      if(t+e+p!==100){ toast('Los pesos deben sumar 100% (van '+(t+e+p)+')',true); return false; }
      await sb.from('lic_licitaciones').update({peso_tecnica:t,peso_economica:e,peso_performance:p}).eq('id',L.id);
      closeModal(); toast('Pesos actualizados'); openDetail(L.id);
    }});
}
function openScore(oid){
  var o=STATE.cur.ofertas.find(function(x){return x.id===oid;}); var L=STATE.cur.lic;
  openModal({ title:'Puntaje · '+esc(o.contratista), sub:'Puntúa cada eje 0–100. El total se pondera con los pesos configurados.',
    body:'<div class="fgrid">'+fInput('sc-t','Técnica (0-100)',o.score_tecnica||'','number')+fInput('sc-e','Económica (0-100)',o.score_economica||'','number')+fInput('sc-p','Performance (0-100)',o.score_performance||'','number')+'</div><div class="fhint" id="sc-preview" style="margin-top:6px"></div>',
    okText:'Guardar puntaje', ok: async function(){
      var t=Number($('#sc-t').value||0),e=Number($('#sc-e').value||0),p=Number($('#sc-p').value||0);
      var total=Math.round((t*L.peso_tecnica + e*L.peso_economica + p*L.peso_performance)/100);
      await sb.from('lic_ofertas').update({score_tecnica:t,score_economica:e,score_performance:p,score_total:total}).eq('id',oid);
      await logEvento(L.id,'Evaluación',o.contratista+': '+total+'/100');
      closeModal(); toast('Puntaje: '+total+'/100'); openDetail(L.id);
    }, after:function(){
      function pv(){ var t=Number($('#sc-t').value||0),e=Number($('#sc-e').value||0),p=Number($('#sc-p').value||0); var total=Math.round((t*L.peso_tecnica+e*L.peso_economica+p*L.peso_performance)/100); $('#sc-preview').innerHTML='Puntaje ponderado: <b style="color:#0ea5a4">'+total+'/100</b> (Téc '+L.peso_tecnica+'% · Eco '+L.peso_economica+'% · Perf '+L.peso_performance+'%)'; }
      ['sc-t','sc-e','sc-p'].forEach(function(id){ $('#'+id).oninput=pv; }); pv();
    }});
}

// ═════ Tab: Adjudicación ═════
function tabAdjudicacion(){
  var c=STATE.cur, L=c.lic, cur=L.moneda;
  if(!c.ofertas.length) return '<div class="empty"><i data-lucide="award"></i>Sin ofertas. No hay nada que adjudicar.</div>';
  var base=c.partidas.reduce(function(s,p){return s+Number(p.cantidad||0)*Number(p.pu_base||0);},0)||Number(L.presupuesto_base||0);
  var ofs=c.ofertas.slice().sort(function(a,b){ return (Number(b.score_total||0))-(Number(a.score_total||0)); });
  var adj=c.adj;
  var matriz='<div class="panel"><div class="panel-t"><i data-lucide="award"></i>Matriz de adjudicación</div>'+
    '<div class="panel-d">Decisión final. Las propuestas perdedoras se conservan como historial.</div>'+
    '<div class="tbl-wrap"><table class="tbl" style="min-width:640px"><thead><tr><th>Contratista</th><th class="num">Oferta</th><th class="num">Score</th><th class="num">Plazo</th><th class="num">Δ vs presup.</th><th>Validación</th><th></th></tr></thead><tbody>'+
    ofs.map(function(o){
      var diff=Number(o.monto_total)-base; var pct=base?(diff/base*100):0; var vs=valState(o.validacion);
      var isWin=adj&&adj.oferta_id===o.id;
      return '<tr'+(isWin?' style="background:#f0fdfa"':'')+'><td style="font-weight:800">'+esc(o.contratista)+(isWin?' <span class="badge-win">ganador</span>':'')+'</td>'+
        '<td class="num">'+money(o.monto_total,cur)+'</td>'+
        '<td class="num" style="font-weight:800;color:'+(o.score_total>=85?'#0f7a54':o.score_total>=70?'#0ea5a4':'#b45309')+'">'+(o.score_total||'—')+'</td>'+
        '<td class="num">'+(o.plazo_dias||'—')+'d</td>'+
        '<td class="num '+(diff>0?'diffneg':'diffpos')+'">'+(diff>0?'+':'')+pct.toFixed(1)+'%</td>'+
        '<td>'+(vs==='ok'?'<span class="vpill ok">🟢</span>':vs==='fail'?'<span class="vpill fail">🔴</span>':'<span class="vpill pend">🟡</span>')+'</td>'+
        '<td>'+(adj?'':'<button class="btn btn-sm btn-primary" data-win="'+o.id+'"><i data-lucide="award"></i>Adjudicar</button>')+'</td></tr>';
    }).join('')+'</tbody></table></div></div>';
  var decision = adj ? '<div class="panel" style="border:1.5px solid var(--teal)">'+
      '<div class="panel-t"><i data-lucide="badge-check"></i>Adjudicación registrada</div>'+
      dataRow('Ganador',esc(adj.contratista))+dataRow('Monto adjudicado',money(adj.monto_adjudicado,cur))+
      dataRow('Contrato',esc(adj.contrato_codigo||'—'))+dataRow('Responsable',esc(adj.responsable||'—'))+
      dataRow('Aprobador',esc(adj.aprobador||'—'))+dataRow('Fecha',fmtDate(adj.fecha))+
      '<div style="margin-top:12px"><div style="font-size:11px;font-weight:800;color:#94a3b8;text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px">Justificación</div><div style="font-size:13px;color:#334155">'+esc(adj.justificacion||'—')+'</div></div>'+
    '</div>' : '';
  var ejecucion = adj ? contratoEjecucion(adj, c.facturas, cur) : '';
  return matriz+decision+ejecucion;
}
// Panel de ejecución del contrato: adjudicado vs facturado vs saldo (facturas en instancia Contratas)
function contratoEjecucion(adj, facturas, cur){
  facturas = facturas||[];
  var adjudicado=Number(adj.monto_adjudicado||0);
  var facturado=facturas.reduce(function(s,f){ return s+Number(f.monto||0); },0);
  var saldo=adjudicado-facturado;
  var pct=adjudicado? Math.min(100, Math.round(facturado/adjudicado*100)):0;
  var REV={ aprobada:['#0f7a54','#d1fae5','Aprobada'], pendiente:['#b45309','#fef3c7','Pendiente'], observada:['#c0453b','#fee2e2','Observada'] };
  return '<div class="panel">'+
    '<div class="panel-t"><i data-lucide="link"></i>Ejecución del contrato '+esc(adj.contrato_codigo||'')+' <span style="font-size:10.5px;font-weight:700;color:#94a3b8;text-transform:none;letter-spacing:0">· facturas en vivo desde el portal de Contratas</span></div>'+
    '<div class="kgrid" style="grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px">'+
      miniStat(money(adjudicado,cur),'Monto adjudicado','file-signature','#0f1e35')+
      miniStat(money(facturado,cur),'Facturado','receipt','#0ea5a4')+
      miniStat(money(saldo,cur),'Saldo contractual','wallet', saldo>0?'#2266b0':'#c0453b')+
    '</div>'+
    '<div style="font-size:11.5px;font-weight:700;color:#64748b;display:flex;justify-content:space-between;margin-bottom:4px"><span>Avance de facturación</span><span>'+pct+'%</span></div>'+
    '<div class="bar" style="margin-bottom:14px"><i style="width:'+pct+'%;background:linear-gradient(90deg,var(--teal),var(--brand))"></i></div>'+
    (facturas.length?'<div class="tbl-wrap"><table class="tbl"><thead><tr><th>N° Factura</th><th>Contratista</th><th>Fecha</th><th class="num">Monto</th><th>Revisión</th></tr></thead><tbody>'+
      facturas.map(function(f){ var r=REV[f.estado_revision]||['#64748b','#f1f5f9',f.estado_revision||'—']; return '<tr><td style="font-family:monospace;font-weight:700">'+esc(f.num||'—')+'</td><td>'+esc(f.contrata||'—')+'</td><td>'+fmtDate(f.fecha)+'</td><td class="num">'+money(f.monto,cur)+'</td><td><span style="font-size:10.5px;font-weight:800;padding:3px 9px;border-radius:20px;background:'+r[1]+';color:'+r[0]+'">'+esc(r[2])+'</span></td></tr>'; }).join('')+
      '</tbody></table></div>':'<div class="empty" style="padding:22px"><i data-lucide="receipt"></i>Aún no hay facturas registradas contra este contrato</div>')+
    '<div style="font-size:11px;color:#94a3b8;margin-top:10px;font-weight:600"><i data-lucide="info" style="width:12px;height:12px;vertical-align:-2px"></i> El contratista registra sus facturas en el portal de Contratas seleccionando este contrato. Aquí se reflejan y descuentan del saldo.</div>'+
  '</div>';
}
window.bind_adjudicacion=function(){
  document.querySelectorAll('[data-win]').forEach(function(b){ b.onclick=function(){ openAdjudicar(b.getAttribute('data-win')); }; });
};
function openAdjudicar(oid){
  var c=STATE.cur, L=c.lic; var o=c.ofertas.find(function(x){return x.id===oid;});
  var maxN=0; STATE.lics.forEach(function(l){}); // contrato correlativo simple
  var year=(new Date()).getFullYear();
  openModal({ title:'Adjudicar a '+esc(o.contratista), sub:'Registra la decisión. Genera el vínculo con el contrato para el flujo de facturación.',
    body:'<div class="fgrid">'+
      fInput('aj-monto','Monto adjudicado',o.monto_total,'number')+
      fInput('aj-contrato','Código de contrato','CTR-'+year+'-','text')+
      fInput('aj-resp','Responsable',USER,'text')+
      fInput('aj-aprob','Aprobador','Gerencia de Operaciones','text')+
      fArea('aj-just','Justificación <span class="req">*</span>','Mejor puntaje técnico-económico ('+(o.score_total||'—')+'/100).',true)+
    '</div>',
    okText:'Confirmar adjudicación', ok: async function(){
      var just=$('#aj-just').value.trim(); if(!just){ toast('Justificación obligatoria',true); return false; }
      try{
        var aj=await sb.from('lic_adjudicaciones').insert({ licitacion_id:L.id, licitacion_codigo:L.codigo, email:o.email||null, oferta_id:oid, contratista:o.contratista, monto_adjudicado:Number($('#aj-monto').value||0), contrato_codigo:$('#aj-contrato').value.trim()||null, responsable:$('#aj-resp').value.trim(), aprobador:$('#aj-aprob').value.trim(), justificacion:just });
        if(aj.error) throw aj.error;
        await sb.from('lic_ofertas').update({estado:'Adjudicada'}).eq('id',oid);
        await sb.from('lic_licitaciones').update({estado:'Adjudicación'}).eq('id',L.id);
        await logEvento(L.id,'Adjudicación','Adjudicado a '+o.contratista+' — '+money($('#aj-monto').value,L.moneda));
        closeModal(); toast('Adjudicado a '+o.contratista); openDetail(L.id); refreshListSilent();
      }catch(e){ toast('Error: '+(e.message||e),true); return false; }
    }});
}

// ══════════════ Utilidades genéricas ══════════════
async function delRow(table,id,msg){
  if(!confirm('¿Eliminar este registro?')) return;
  try{ await sb.from(table).delete().eq('id',id); toast(msg||'Eliminado'); openDetail(STATE.cur.lic.id); }catch(e){ toast('Error: '+(e.message||e),true); }
}

// form field builders
function fInput(id,label,val,type,full,ro){ return '<div class="fg'+(full?' full':'')+'"><label>'+label+'</label><input id="'+id+'" type="'+(type||'text')+'" value="'+esc(val==null?'':val)+'"'+(ro?' readonly style="background:#f8fafc;color:#64748b"':'')+'></div>'; }
function fArea(id,label,val,full){ return '<div class="fg'+(full?' full':'')+'"><label>'+label+'</label><textarea id="'+id+'">'+esc(val||'')+'</textarea></div>'; }
function fSelect(id,label,opts,cur){ return '<div class="fg"><label>'+label+'</label><select id="'+id+'">'+opts.map(function(o){ return '<option'+(String(cur)===String(o)?' selected':'')+'>'+esc(o)+'</option>'; }).join('')+'</select></div>'; }

// modal engine
var MODAL_OK=null;
function openModal(o){
  var wrap=document.createElement('div'); wrap.className='ov on'; wrap.id='__modal';
  wrap.innerHTML='<div class="modal'+(o.wide?' wide':'')+'"><div class="modal-h"><div><div class="modal-h-t">'+o.title+'</div>'+(o.sub?'<div class="modal-h-s">'+o.sub+'</div>':'')+'</div><button class="modal-x" id="__mx">&times;</button></div><div class="modal-b">'+o.body+'</div><div class="modal-f"><button class="btn" id="__mc">Cancelar</button><button class="btn btn-primary" id="__mo">'+(o.okText||'Guardar')+'</button></div></div>';
  document.body.appendChild(wrap); icons();
  MODAL_OK=o.ok;
  $('#__mx').onclick=closeModal; $('#__mc').onclick=closeModal;
  wrap.onclick=function(e){ if(e.target===wrap) closeModal(); };
  $('#__mo').onclick=async function(){ var btn=this; btn.disabled=true; var r=await (MODAL_OK?MODAL_OK():true); if(r===false) btn.disabled=false; };
  if(o.after) try{ o.after(); }catch(e){ console.warn(e); }
}
function closeModal(){ var m=$('#__modal'); if(m) m.remove(); MODAL_OK=null; }

// boot
boot();
})();
</script>
</body>
