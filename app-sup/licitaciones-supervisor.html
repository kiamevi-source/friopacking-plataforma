<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Licitaciones · Supervisor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--brand:#2E7DD1;--brand-d:#1d4ed8;--teal:#0ea5a4;--ink:#0b1226;--t2:#475569;--t3:#94a3b8;--bd:#e3e8f0;--bg:#f4f6fb;--card:#fff;--ok:#12805c;--warn:#b45309;--bad:#b42318}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.45}
.wrap{max-width:1100px;margin:0 auto;padding:18px 16px 60px}
button{font-family:inherit;cursor:pointer}
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.h1{font-size:21px;font-weight:800;letter-spacing:-.3px}
.sub{font-size:13px;color:var(--t2);margin-top:2px}
.btn{border:1px solid var(--bd);background:#fff;color:var(--ink);font-weight:700;font-size:13px;padding:9px 14px;border-radius:10px;display:inline-flex;align-items:center;gap:7px}
.btn:hover{border-color:#b9c7dd}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.pri:hover{background:var(--brand-d)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.sm{padding:6px 10px;font-size:12px}
.btn:disabled{opacity:.55;cursor:default}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px 18px;margin-bottom:12px}
.card h3{font-size:14.5px;font-weight:800;margin-bottom:4px}
.card .hint{font-size:12.5px;color:var(--t2);margin-bottom:10px}
.lic{display:flex;justify-content:space-between;gap:12px;align-items:center;cursor:pointer}
.lic:hover{border-color:#b9c7dd}
.cod{font-family:ui-monospace,Menlo,monospace;font-size:11.5px;color:var(--teal);font-weight:700}
.nm{font-size:15px;font-weight:800;margin-top:2px}
.meta{font-size:12px;color:var(--t2);margin-top:3px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:800;padding:4px 11px;border-radius:20px;white-space:nowrap}
.p-borr{background:#eef1f5;color:#475569}.p-apr{background:#fdf3d7;color:#8a5a00}.p-obs{background:#fff1e6;color:#c2410c}.p-ok{background:#e3f6ee;color:#12805c}.p-cur{background:#e5eefd;color:#1f5fbf}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fg{display:flex;flex-direction:column;gap:5px}
.fg.full{grid-column:1/-1}
.fg label{font-size:12px;font-weight:700;color:var(--t2)}
.fg input,.fg textarea,.fg select{border:1px solid var(--bd);border-radius:9px;padding:9px 11px;font-family:inherit;font-size:13.5px;background:#fff;color:var(--ink)}
.fg textarea{min-height:70px;resize:vertical}
.req{color:var(--bad)}
.rubro{display:flex;align-items:center;gap:9px;padding:9px 12px;background:#eef2f8;border-bottom:1px solid #e2e8f0;font-size:13px;font-weight:800;position:sticky;top:0;z-index:1}
.rubro span.t{flex:1}
.rubro small{font-weight:600;color:var(--t2);font-size:11.5px}
.it{display:flex;align-items:center;gap:9px;padding:8px 12px 8px 30px;border-bottom:1px solid #f1f4f8;font-size:13px;cursor:pointer}
.it.off{opacity:.5;cursor:default}
.it .c{font-family:ui-monospace,Menlo,monospace;font-size:11px;color:var(--t3);white-space:nowrap}
.it .d{flex:1;min-width:0}
.it .q{font-size:12px;color:var(--t2);white-space:nowrap}
.tag{font-size:10.5px;font-weight:800;padding:1px 7px;border-radius:6px;background:#e2e8f0;color:#475569;white-space:nowrap}
.lista{border:1px solid var(--bd);border-radius:12px;max-height:420px;overflow:auto}
.sel{border:1px solid var(--bd);border-radius:12px;overflow:hidden}
.sel .row{padding:10px 12px;border-bottom:1px solid #f1f4f8}
.sel .row:last-child{border-bottom:0}
.sel .row b{font-size:13px}
.sel .row textarea{width:100%;margin-top:6px;border:1px solid var(--bd);border-radius:8px;padding:7px 9px;font-family:inherit;font-size:12.5px;min-height:46px;resize:vertical}
.doc{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #f1f4f8;font-size:13px}
.doc:last-child{border-bottom:0}
.doc .n{flex:1;min-width:0}
.doc .n small{display:block;color:var(--t2);font-size:12px}
.obs{background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;border-radius:12px;padding:11px 14px;font-size:13px;margin-bottom:12px}
.info{background:#eef4fe;border:1px solid #cfe0fb;color:#1f4f9c;border-radius:12px;padding:11px 14px;font-size:13px;margin-bottom:12px}
.empty{padding:30px 16px;text-align:center;color:var(--t3);font-weight:600;background:#fff;border:1px dashed var(--bd);border-radius:14px}
.bar{position:sticky;bottom:0;background:rgba(244,246,251,.96);backdrop-filter:blur(4px);padding:12px 0;display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;border-top:1px solid var(--bd);margin-top:6px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);background:#0b1226;color:#fff;padding:11px 16px;border-radius:11px;font-size:13px;font-weight:600;opacity:0;transition:.2s;z-index:50;max-width:90vw}
.toast.on{opacity:1;transform:translateX(-50%)}
.toast.err{background:#b42318}
.sug{display:flex;align-items:center;gap:9px;padding:7px 12px;border-bottom:1px solid #f1f4f8;font-size:13px;cursor:pointer}
.sug .e{color:var(--t2);font-size:11.5px}
.it .st{margin-left:4px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--bd);background:#fff;border-radius:20px;padding:5px 11px;font-size:12.5px;font-weight:700;color:var(--t2);cursor:pointer}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
.chip.sug:not(.on){border-color:#93c5fd;color:#1d4ed8}
.urg{background:#fef2f2;border:1px solid #fecaca;color:#991b1b;border-radius:12px;padding:10px 14px;font-size:13px;margin-bottom:12px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.p-urg{background:#fee2e2;color:#b91c1c}
.reco{font-size:11px;font-weight:700;color:#1d4ed8;margin-top:2px}
.from{font-size:11px;color:var(--teal);font-weight:700;margin-top:3px}
.it.lnk{cursor:pointer}
.lista.alta{max-height:none}
.sec-t{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--t2);margin:18px 0 8px}
@media(max-width:700px){.grid{grid-template-columns:1fr}.h1{font-size:18px}.it{flex-wrap:wrap}}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="empty">Cargando…</div></div>
<div class="toast" id="toast"></div>
<script>
(function(){
// Canal seguro: función lic-supervisor en PMO (valida el token del supervisor y su acceso a la obra)
var FN='https://vsploxglutkbeokumunp.supabase.co/functions/v1/lic-supervisor';

var CT_URL='https://uijuokwcsvnlzxoyvrcj.supabase.co';
var CT_ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVpanVva3djc3ZubHp4b3l2cmNqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA1MTUwMDgsImV4cCI6MjA5NjA5MTAwOH0.-JtaWOf3QPRB5W1Z7rLp5Rabr83xdWIqX4GngkpFeJU';
var TIPOS=['Plano','Especificación técnica','Metrado','Bases','Cronograma referencial','Foto','Otro'];
var pmo=null, ct=null, ing=null;
var ING_URL='https://qkgwvzxtdobgyjvwkhrk.supabase.co', ING_KEY='sb_publishable_yCAAlaw6viS6KEow5x4OdQ_SaMLDHQ1';
try{ ing=supabase.createClient(ING_URL,ING_KEY,{auth:{persistSession:false}}); }catch(e){}

var $=function(s){ return document.querySelector(s); };
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function nn(s){ return String(s==null?'':s).trim().toLowerCase(); }
function usd(n){ return 'US$ '+Number(n||0).toLocaleString('es-PE',{maximumFractionDigits:0}); }
function fdate(s){ if(!s) return '—'; var d=new Date(String(s).length<=10?s+'T12:00:00':s); return isNaN(d)?'—':d.toLocaleDateString('es-PE',{day:'2-digit',month:'short',year:'numeric'}); }
var tt; function toast(m,err){ var t=$('#toast'); t.textContent=m; t.classList.toggle('err',!!err); t.classList.add('on'); clearTimeout(tt); tt=setTimeout(function(){ t.classList.remove('on'); },3600); }

async function token(){ try{ if(parent && parent.sbTokenVigente) return await parent.sbTokenVigente(); }catch(e){} try{ return localStorage.getItem('sb_token'); }catch(e){ return null; } }
async function api(accion, body){
  var t=await token(); if(!t) throw new Error('Inicia sesión en el Centro de Control del Supervisor');
  var r=await fetch(FN,{ method:'POST', headers:{'Content-Type':'application/json', Authorization:'Bearer '+t}, body:JSON.stringify(Object.assign({accion:accion}, body||{})) });
  var j=null; try{ j=await r.json(); }catch(e){}
  if(!r.ok) throw new Error((j&&j.error)||('Error '+r.status));
  return j;
}

var qs=new URLSearchParams(location.search);
var S={ cod:qs.get('cod')||'', nombre:qs.get('nombre')||'', obras:[], lics:[], cur:null, lic:[], cuentas:null };

function pill(e){ var m={'Borrador':'p-borr','Observada':'p-obs','Por aprobar':'p-apr','Preparación':'p-apr','Publicada':'p-cur','Invitaciones':'p-cur','Ofertas':'p-cur','Evaluación':'p-cur','Negociación':'p-cur','Adjudicación':'p-cur','Contratada':'p-ok','Cerrada':'p-ok','Desierta':'p-obs'}; var lab={'Por aprobar':'Enviada a Gerencia','Observada':'Observada por Gerencia','Preparación':'Enviada a Gerencia'}[e]||e; return '<span class="pill '+(m[e]||'p-borr')+'">'+esc(lab)+'</span>'; }

async function boot(){
  var app=$('#app');
  try{
    if(!S.cod){
      S.obras=await api('obras');
      if(!S.obras.length){ app.innerHTML='<div class="empty">No tienes obras asignadas para licitar.</div>'; return; }
      if(S.obras.length===1){ S.cod=S.obras[0].cod_proyecto; S.nombre=S.obras[0].nombre; }
      else return pintarObras();
    }
    await cargar();
  }catch(e){ app.innerHTML='<div class="empty">'+esc(e.message||e)+'</div>'; }
}
function pintarObras(){
  $('#app').innerHTML='<div class="head"><div><div class="h1">Licitaciones</div><div class="sub">Elige la obra.</div></div></div>'+
    S.obras.map(function(o){ return '<div class="card lic" data-obra="'+esc(o.cod_proyecto)+'"><div><div class="cod">'+esc(o.cod_proyecto)+'</div><div class="nm">'+esc(o.nombre)+'</div></div><span class="pill p-borr">'+esc(o.estado||'')+'</span></div>'; }).join('');
  document.querySelectorAll('[data-obra]').forEach(function(el){ el.onclick=function(){ var o=S.obras.find(function(x){ return x.cod_proyecto===el.dataset.obra; }); S.cod=o.cod_proyecto; S.nombre=o.nombre; cargar(); }; });
}
async function cargar(){
  $('#app').innerHTML='<div class="empty">Cargando licitaciones de '+esc(S.nombre||S.cod)+'…</div>';
  var r=await Promise.all([api('listar',{cod_proyecto:S.cod}), api('partidas_licitables',{cod_proyecto:S.cod})]);
  S.lics=r[0]; S.filas=r[1]; S.marc={};
  S.serv=[]; try{ var sv=await pmo.from('portafolio_servicios').select('especialidad,situacion,contratista').eq('cod_proyecto',S.cod); S.serv=sv.data||[]; }catch(e){}
  // fechas de inicio del cronograma por partida, para avisar qué hay que licitar ya
  S.ini={};
  try{ if(parent && parent.sbFetch){
    var g=await parent.sbFetch('/rest/v1/v_gantt_supervisor?cod_proyecto=eq.'+encodeURIComponent(S.cod)+'&presupuesto_id=not.is.null&select=presupuesto_id,fecha_inicio_base');
    (g||[]).forEach(function(t){ if(t.fecha_inicio_base){ var k=Number(t.presupuesto_id); if(!S.ini[k]||t.fecha_inicio_base<S.ini[k]) S.ini[k]=t.fecha_inicio_base; } });
  } }catch(e){}
  pintarLista();
}
function pintarLista(){
  var app=$('#app');
  S.rubrosE=agrupar(S.filas||[], null);
  var marcadas=[]; S.rubrosE.forEach(function(R){ R.items.forEach(function(it){ if(S.marc[it.key]) marcadas.push(it); }); });
  var cnt={}, urg=[]; S.rubrosE.forEach(function(R){ R.items.forEach(function(it){
    it._ct = it.en ? null : svContratoDe(it.f, S.serv);          // contrato ya registrado en Servicios
    it._bloq = !!it.en || !!(it._ct && !it._ct.parcial);
    var t=estadoPartida(it.en, it).t; cnt[t]=(cnt[t]||0)+1; var d=diasInicio(it); it._dias=d; if(!it._bloq && d!==null && d<=URGENTE) urg.push(it); }); });
  app.innerHTML='<div class="head"><div><div class="h1">Licitaciones · '+esc(S.nombre||S.cod)+'</div><div class="sub">Marca las partidas y presiona «Licitar». Cada partida muestra en qué va su licitación.</div></div>'+
      '<div style="display:flex;gap:8px">'+(S.obras.length>1?'<button class="btn" id="otra">Cambiar obra</button>':'')+'</div></div>'+
    (urg.length?'<div class="urg"><span><b>'+urg.length+' partida'+(urg.length===1?'':'s')+' por licitar</b> empieza'+(urg.length===1?'':'n')+' en el cronograma en menos de '+URGENTE+' días.</span><button class="btn sm" id="marcar-urg">Marcarlas</button></div>':'')+
    '<div class="card"><h3>Partidas</h3><div class="hint">'+Object.keys(cnt).map(function(k){ return cnt[k]+' '+k.toLowerCase(); }).join(' · ')+'</div>'+
    (S.rubrosE.length? '<div class="lista alta">'+S.rubrosE.map(function(R,ri){
        var libres=R.items.filter(function(it){ return !it._bloq; });
        return '<div class="rubro"><input type="checkbox" data-erub="'+ri+'"'+(libres.length&&libres.every(function(it){ return S.marc[it.key]; })?' checked':'')+(libres.length?'':' disabled')+'><span class="t">'+esc(R.nombre)+'</span><small>'+R.items.length+' líneas</small></div>'+
          R.items.map(function(it,ii){ var st=estadoPartida(it.en, it);
            return '<label class="it'+(it.en?' lnk':'')+'"'+(it.en?' data-ver="'+esc(it.en.id)+'"':'')+'><input type="checkbox" data-eit="'+ri+'-'+ii+'"'+(S.marc[it.key]?' checked':'')+(it._bloq?' disabled':'')+'><span class="c">'+esc(it.codigo)+'</span><span class="d">'+esc(it.descripcion)+(it.ids.length>1?' <span class="tag">'+it.ids.length+' ítems</span>':'')+'</span><span class="q">'+Number(Math.round(it.cantidad*100)/100).toLocaleString('es-PE')+' '+esc(it.unidad||'')+'</span>'+(!it._bloq && it._dias!==null && it._dias<=URGENTE?'<span class="pill p-urg st">'+(it._dias<0?'Debió empezar hace '+(-it._dias)+' d':'Empieza en '+it._dias+' d')+'</span>':'')+'<span class="pill '+st.c+' st">'+esc(st.t)+(it.en?' · '+esc(it.en.codigo):(it._ct&&it._ct.contratista?' · '+esc(it._ct.contratista):''))+'</span></label>'; }).join('');
      }).join('')+'</div>' : '<div class="empty" style="border:0">Esta obra no tiene partidas licitables en el presupuesto.</div>')+
    '</div>'+
    (marcadas.length?'<div class="bar"><span style="align-self:center;font-size:13px;color:var(--t2)">'+marcadas.length+' partida'+(marcadas.length===1?'':'s')+' marcada'+(marcadas.length===1?'':'s')+'</span><button class="btn pri" id="licitar">Licitar</button></div>':'')+
    '<div class="sec-t">Licitaciones de la obra</div>'+
    (S.lics.length? S.lics.map(function(L){
      return '<div class="card lic" data-lic="'+L.id+'"><div style="min-width:0"><div class="cod">'+esc(L.codigo)+'</div><div class="nm">'+esc(L.nombre)+'</div>'+
        '<div class="meta">'+L.partidas.length+' partida'+(L.partidas.length===1?'':'s')+' · '+L.adjuntos.length+' adjunto'+(L.adjuntos.length===1?'':'s')+(L.fecha_limite?' · cierre '+fdate(L.fecha_limite):'')+(L.origen==='supervisor'&&L.creado_por_email?' · armada por '+esc(L.creado_por_email):(L.origen!=='supervisor'?' · creada por Gerencia':''))+'</div>'+
        (L.estado==='Observada'&&L.observacion_gerencia?'<div class="meta" style="color:#c2410c;font-weight:700">Gerencia pide: '+esc(L.observacion_gerencia)+'</div>':'')+
        '</div>'+pill(L.estado)+'</div>';
    }).join('') : '<div class="empty">Aún no hay licitaciones en esta obra. Marca partidas arriba y presiona «Licitar».</div>');
  document.querySelectorAll('[data-eit]').forEach(function(cb){ cb.onchange=function(){ var p=cb.dataset.eit.split('-'); var it=S.rubrosE[p[0]].items[p[1]]; if(cb.checked) S.marc[it.key]=true; else delete S.marc[it.key]; pintarLista(); }; });
  document.querySelectorAll('[data-erub]').forEach(function(cb){ cb.onchange=function(){ S.rubrosE[cb.dataset.erub].items.forEach(function(it){ if(it._bloq) return; if(cb.checked) S.marc[it.key]=true; else delete S.marc[it.key]; }); pintarLista(); }; });
  document.querySelectorAll('[data-ver]').forEach(function(el){ el.onclick=function(e){ e.preventDefault(); var L=S.lics.find(function(x){ return x.id===el.dataset.ver; }); if(L) abrir(L); }; });
  var lb=$('#licitar'); if(lb) lb.onclick=function(){ abrir(null, Object.keys(S.marc)); };
  var mu=$('#marcar-urg'); if(mu) mu.onclick=function(){ urg.forEach(function(it){ S.marc[it.key]=true; }); pintarLista(); };
  var o=$('#otra'); if(o) o.onclick=function(){ S.cod=''; boot(); };
  document.querySelectorAll('[data-lic]').forEach(function(el){ el.onclick=function(){ abrir(S.lics.find(function(x){ return x.id===el.dataset.lic; })); }; });
}

// ── Contratos de Servicios (portafolio_servicios, PMO) ↔ partidas (Kiara, 20-oct-2026) ──
// Servicios guarda los contratos por obra + especialidad, no por partida. Si una partida no tiene
// licitación, se busca ahí el contrato que la cubre. Misma regla del cruce revisado con Kiara:
// la especialidad de la partida sale de NISIRA (capítulo > rubro > partida); «EEMM» = montaje de
// equipos y «Mecánica» = tuberías y puesta en marcha (si la obra no tiene EEMM aparte, Mecánica
// cubre también los equipos); «Instalación electromecánica» = mecánica + eléctrico (+ equipos y
// aislamiento si no se contrataron aparte); obras civiles por tipo; lotes «1/2» = mismo contrato partido.
function svSinTilde(t){ return String(t==null?'':t).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/\s+/g,' ').trim(); }
function svSubCivil(t){ t=svSinTilde(t);
  if(/tierra|excav|relleno|afirmado|subrasante|sub rasante|subbase|sub base/.test(t)) return 'tierras';
  if(/zapata|cimiento/.test(t)) return 'zapatas';
  if(/contencion/.test(t)) return 'muro';
  if(/zocalo/.test(t)) return null;
  if(/sanitar|agua|desag|inodoro|grifer|lavaman|urinario|drenaje|sumidero/.test(t)) return 'sanitarios';
  if(/losa|loza/.test(t)) return 'losa';
  return null; }
// Clave de especialidad de una partida: f = { descripcion, rubro, partida, capitulo }
function svKey(f){
  var d=svSinTilde(f.descripcion), c=svSinTilde(f.capitulo), r=svSinTilde(f.rubro), p=svSinTilde(f.partida);
  if(c.indexOf('hvac')>=0) return 'hvac';
  var civil=/movimiento de tierra|afirmado|concreto|losa|loza|resane|demolici|zapata|muro de contencion/.test(d);
  if(r.indexOf('obras civiles')===0 || (civil && r.indexOf('instalacion electrica')!==0 && r.indexOf('instalacion mecanica')!==0)){
    var sub=svSubCivil(p)||svSubCivil(d); return sub?'oocc_'+sub:'oocc'; }
  if(/gasificad/.test(c+' '+p+' '+d)) return 'gasificado';
  if(/rack/.test(d) || /rack pallet/.test(c)) return 'rack';
  if(/lona/.test(d)) return 'lonas';
  if(/seccionamiento/.test(d)) return 'seccionamiento';
  if(/reubic/.test(d)) return 'reubicacion';
  if(/aislamiento/.test(p)) return /piso/.test(d)?'aislamiento_piso':'aislamiento';
  if(/piso/.test(d) && /aislam/.test(d)) return 'aislamiento_piso';
  if(r.indexOf('montaje de camaras')===0) return 'paneles';
  if(r.indexOf('instalacion electrica')===0) return 'electrico';
  if(r.indexOf('instalacion mecanica')===0) return p.indexOf('instalacion de equipo')===0?'equipos':'mecanica';
  if(r.indexOf('estructuras metalicas')===0) return 'estructura';
  return null;
}
function svEspNorm(e){ return svSinTilde(e).replace(/\s+\d+$/,''); }
// Qué claves cubre un contrato de Servicios, sabiendo qué más se contrató aparte en la obra
function svCubre(esp, pres){
  var e=svEspNorm(esp), s={};
  function add(){ for(var i=0;i<arguments.length;i++) s[arguments[i]]=1; }
  if(e==='aislamiento') add('aislamiento');
  else if(e==='aislamiento de piso') add('aislamiento_piso');
  else if(e==='lonas'||e==='lona') add('lonas');
  else if(e==='paneles') add('paneles');
  else if(e==='electrico') add('electrico');
  else if(e==='mecanica'||e==='mecanico'){ add('mecanica'); if(!pres.eemm) add('equipos'); }
  else if(e==='eemm'||e==='montaje de eemm') add('equipos');
  else if(e.indexOf('electromecanica')>=0 || e==='mecanica y electrico'){ add('mecanica','electrico'); if(!pres.eemm) add('equipos'); if(!pres.aisl) add('aislamiento'); }
  else if(e==='hvac') add('hvac');
  else if(e.indexOf('gasificado')>=0) add('gasificado');
  else if(e.indexOf('rack')>=0) add('rack');
  else if(e.indexOf('reubicacion')>=0) add('reubicacion');
  else if(e==='seccionamiento') add('seccionamiento');
  else if(e==='oocc'||e==='obras civiles') add('oocc','oocc_tierras','oocc_zapatas','oocc_muro','oocc_sanitarios','oocc_losa');
  else if(e==='movimiento de tierras') add('oocc_tierras');
  else if(e==='zapatas') add('oocc_zapatas');
  else if(e==='muro de contencion') add('oocc_muro');
  else if(e==='sanitarios') add('oocc_sanitarios');
  else if(e==='losa') add('oocc_losa');
  return s;
}
function svPresentes(filas){
  var es=(filas||[]).map(function(r){ return svEspNorm(r.especialidad); });
  return { eemm: es.some(function(e){ return e==='eemm'||e==='montaje de eemm'; }), aisl: es.indexOf('aislamiento')>=0 };
}
// filas: contratos de Servicios de la obra · f: partida → { parcial, contratista } o null
function svContratoDe(f, filas){
  if(!filas || !filas.length) return null;
  var k=svKey(f); if(!k) return null;
  var pres=svPresentes(filas);
  var hits=filas.filter(function(r){ return svCubre(r.especialidad, pres)[k]; });
  var ok=hits.filter(function(r){ return svSinTilde(r.situacion)==='contratado'; });
  if(!ok.length) return null;
  var quien=ok.map(function(r){ return r.contratista; }).filter(Boolean).filter(function(x,i,a){ return a.indexOf(x)===i; }).join(', ');
  return { parcial: ok.length<hits.length, contratista: quien };
}

var ESPS=['Mecánica','Eléctrico','Montaje de equipos (EEMM)','Aislamiento','Paneles y puertas','Lonas','Obras civiles','Estructura metálica','HVAC','Gasificado','Rack'];
// Especialidad de la partida según su lugar en NISIRA (capítulo > rubro > partida)
function espDeFila(f){
  var d=sinTilde(f.descripcion), c=sinTilde(f.capitulo), r=sinTilde(f.rubro), p=sinTilde(f.partida);
  if(c.indexOf('hvac')>=0) return 'HVAC';
  if(/gasificad/.test(c+' '+p+' '+d)) return 'Gasificado';
  if(/rack/.test(d)||/rack pallet/.test(c)) return 'Rack';
  if(/lona/.test(d)) return 'Lonas';
  if(/aislamiento/.test(p)) return 'Aislamiento';
  if(r.indexOf('obras civiles')===0) return 'Obras civiles';
  if(r.indexOf('montaje de camaras')===0) return 'Paneles y puertas';
  if(r.indexOf('instalacion electrica')===0) return 'Eléctrico';
  if(r.indexOf('instalacion mecanica')===0) return p.indexOf('instalacion de equipo')===0?'Montaje de equipos (EEMM)':'Mecánica';
  if(r.indexOf('estructuras metalicas')===0) return 'Estructura metálica';
  return null;
}
// Junta ítems iguales (misma descripción y unidad, p. ej. uno por ambiente) dentro del rubro
function agrupar(filas, curId){
  var byR={}, rubros=[];
  filas.forEach(function(f){
    var r=f.rubro||'Sin rubro'; if(!byR[r]){ byR[r]={ g:{}, k:[] }; rubros.push(r); }
    var k=nn(f.descripcion)+'|'+nn(f.unidad); var g=byR[r].g[k];
    if(!g){ g=byR[r].g[k]={ key:r+'||'+k, rubro:r, esp:espDeFila(f), codigo:f.item, descripcion:f.descripcion, unidad:f.unidad, cantidad:0, costo:0, ids:[], en:null, f:f }; byR[r].k.push(k); }
    g.cantidad+=Number(f.cantidad||1)||1; g.costo+=Number(f.mano_obra_costo||0); g.ids.push(Number(f.presupuesto_id));
    if(f.licitacion && f.licitacion.id!==curId) g.en=f.licitacion;
  });
  return rubros.map(function(r){ return { nombre:r, items:byR[r].k.map(function(k){ return byR[r].g[k]; }) }; });
}
// Estado de la partida según su licitación (Kiara, 20-oct-2026): Por licitar → En borrador → Invitadas →
// En evaluación → Adjudicada. Es el mismo estado que ve Gerencia: todo sale de lic_* en PMO.
// Días hasta que empieza en el cronograma (la fecha más temprana de sus ítems); null si no tiene fecha
function diasInicio(it){
  var f=null; it.ids.forEach(function(id){ var d=S.ini&&S.ini[id]; if(d&&(!f||d<f)) f=d; });
  if(!f) return null; var h=new Date(); h.setHours(12,0,0,0);
  return Math.round((new Date(f+'T12:00:00')-h)/86400000);
}
var URGENTE=15;
function estadoPartida(en, it){
  if(!en){ if(it && it._ct) return { t: it._ct.parcial?'Contratada en parte':'Contratada', c:'p-ok' }; return { t:'Por licitar', c:'p-borr' }; }
  var L=(S.lics||[]).find(function(x){ return x.id===en.id; });
  var inv=L&&(L.invitados||[]).some(function(v){ return v.estado && v.estado!=='Sugerido'; });
  var e=en.estado;
  if(['Adjudicación','Contratada','Cerrada'].indexOf(e)>=0) return { t:'Adjudicada', c:'p-ok' };
  if(['Ofertas','Evaluación','Negociación'].indexOf(e)>=0) return { t:'En evaluación', c:'p-cur' };
  if(['Publicada','Invitaciones'].indexOf(e)>=0 || inv) return { t:'Invitadas', c:'p-cur' };
  if(e==='Observada') return { t:'Observada', c:'p-obs' };
  if(e==='Por aprobar'||e==='Preparación') return { t:'Enviada', c:'p-apr' };
  return { t:'En borrador', c:'p-borr' };
}

async function abrir(L, preKeys){
  var app=$('#app'); app.innerHTML='<div class="empty">Cargando presupuesto de la obra…</div>';

    var filas=S.cur.editable? await api('partidas_licitables',{cod_proyecto:S.cod}) : [];

    pintarEditor();

// Copia la última especificación escrita para la misma partida en otra licitación (solo si está vacía)
function clave(t){ return nn(t).normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,' ').trim(); }
async function traerEspecificaciones(){

      await api('enviar',{id:S.cur.id});
      // se muestra ya con su estado nuevo (solo lectura), sin esperar a recargar
      S.cur.estado='Por aprobar'; S.cur.editable=false; S.cur.observacion_gerencia=null; pintarEditor();
      toast('Enviada a Gerencia: queda por aprobar');
      api('listar',{cod_proyecto:S.cod}).then(function(l){ S.lics=l; }).catch(function(){});
    }catch(e){ toast(e.message,true); be.disabled=false; bg.disabled=false; be.textContent='Enviar a Gerencia'; }
  };
}
async function guardar(silencioso){
  leerForm(); var L=S.cur;
  if(!L.nombre){ toast('Ponle nombre a la licitación',true); return false; }
  var todos=[]; S.rubros.forEach(function(R){ R.items.forEach(function(it){ todos.push(it); }); });
  var partidas=todos.filter(function(it){ return S.sel[it.key]; }).map(function(it){ return { codigo:it.codigo, descripcion:it.descripcion, unidad:it.unidad, cantidad:Math.round(it.cantidad*1000)/1000, especificacion:(S.sel[it.key].especificacion||'').trim()||null, origen_presupuesto_ids:it.ids }; });
  var btn=$('#guardar'); if(btn){ btn.disabled=true; btn.textContent='Guardando…'; }
  try{
    var r=await api('guardar',{ licitacion:{ id:L.id||undefined, cod_proyecto:S.cod, nombre:L.nombre, especialidad:L.especialidad||null, moneda:'USD', fecha_limite:L.fecha_limite||null, plazo_dias:L.plazo_dias?Number(L.plazo_dias):null, alcance_desc:L.alcance_desc||null, exclusiones:L.exclusiones||null, entregables:L.entregables||null },
      partidas:partidas, sugeridos:(L.invitados||[]).filter(function(v){ return !v.estado||v.estado==='Sugerido'||v.estado==='Invitado'; }).map(function(v){ return { email:v.email, contratista:v.contratista }; }) });
    var id=r&&r.id; if(!silencioso) toast(r&&r.nuevo?'Borrador creado · '+(r.codigo||''):'Borrador guardado');
    var lista=await api('listar',{cod_proyecto:S.cod}); S.lics=lista; var nuevo=lista.find(function(x){ return x.id===id; });
    if(nuevo){ S.cur=JSON.parse(JSON.stringify(nuevo)); }
    if(!silencioso) pintarEditor();
    return true;
  }catch(e){ toast(e.message,true); if(btn){ btn.disabled=false; btn.textContent='Guardar borrador'; } return false; }
}
async function subirAdjunto(){
  leerForm();
  var f=$('#a-file').files[0], desc=$('#a-desc').value.trim(), tipo=$('#a-tipo').value;
  if(!f){ toast('Elige un archivo',true); return; } if(!desc){ toast('Escribe qué es el adjunto',true); return; }
  if(f.size>100*1048576){ toast('El archivo supera 100 MB',true); return; }
  var b=$('#a-subir'); b.disabled=true; b.textContent='Subiendo…';
  var ticket=null;
  try{
    ticket=await api('subir',{ id:S.cur.id, nombre:f.name, tipo:tipo, descripcion:desc, bytes:f.size });
    var up=await pmo.storage.from('lic-expediente').uploadToSignedUrl(ticket.path, ticket.token, f, { contentType:f.type||undefined });
    if(up.error) throw up.error;
    S.cur.adjuntos=(S.cur.adjuntos||[]).concat([{ id:ticket.doc_id, carpeta:tipo, nombre:f.name, descripcion:desc, path:ticket.path }]);
    toast('Adjunto subido'); pintarEditor();
  }catch(e){
    if(ticket&&ticket.doc_id){ try{ await api('quitar_adjunto',{doc_id:ticket.doc_id}); }catch(x){} }
    toast('No se pudo subir: '+(e.message||e),true); b.disabled=false; b.textContent='Subir adjunto';
  }
}
// Palabras con que la especialidad aparece escrita en Servicios / evaluaciones
var ESP_RX={'Mecánica':/mec|electromec|eemm/,'Eléctrico':/electr/,'Montaje de equipos (EEMM)':/eemm|electromec|montaje/,'Aislamiento':/aisla/,
  'Paneles y puertas':/panel|puerta/,'Lonas':/lona/,'Obras civiles':/oocc|civil|tierra|zapata|muro|losa|sanitar/,'Estructura metálica':/estructur/,
  'HVAC':/hvac/,'Gasificado':/gasific/,'Rack':/rack/};
function sinTilde(t){ return nn(t).normalize('NFD').replace(/[\u0300-\u036f]/g,''); }
// Recomendados (Kiara, 20-oct-2026): primero quien ya hizo esta especialidad en otras obras, con su puntaje
async function historialContratas(){
  if(S.hist) return S.hist;
  S.hist={ serv:[], eval:[] };
  try{
    var r=await Promise.all([
      pmo.from('portafolio_servicios').select('contratista,especialidad,cod_proyecto,cliente').eq('situacion','Contratado'),
      pmo.from('evaluacion_contratistas').select('contratista,puntaje_final')
    ]);
    S.hist.serv=(r[0].data||[]); S.hist.eval=(r[1].data||[]);
  }catch(e){}
  return S.hist;
}
function puntuar(c, h){
  var nombres=[c.empresa].concat(Array.isArray(c.aliases)?c.aliases:[]).map(sinTilde).filter(function(x){ return x && x.length>=3; });
  var es=function(t){ t=sinTilde(t); return t && nombres.some(function(n){ return t===n || t.indexOf(n)>=0 || n.indexOf(t)>=0; }); };
  var rx=(S.esp||[]).map(function(e){ return ESP_RX[e]; }).filter(Boolean);
  var obras={}, espHecha={};
  h.serv.forEach(function(r){ if(!es(r.contratista)) return; var e=sinTilde(r.especialidad);
    rx.forEach(function(x,i){ if(x.test(e)){ obras[r.cod_proyecto||r.cliente]=1; espHecha[S.esp[i]]=1; } }); });
  var ps=h.eval.filter(function(r){ return es(r.contratista) && r.puntaje_final!=null; }).map(function(r){ return Number(r.puntaje_final); });
  return { n:Object.keys(obras).length, esp:Object.keys(espHecha), nota:ps.length? Math.round(ps.reduce(function(a,b){ return a+b; },0)/ps.length*10)/10 : null };
}
// Planos de Seguimiento de Planos (Ingeniería) de esta obra que ya tienen archivo
function pryClave(t){ var m=String(t||'').toUpperCase().match(/(PRY|PRD|VSR)\s*(\d{4})\s*-\s*0*(\d+)/); return m?m[1]+m[2]+'-'+m[3]:''; }
async function elegirPlanos(){
  leerForm();
  if(!ing){ toast('No se pudo conectar con Ingeniería',true); return; }
  var planos=[];
  try{
    var r=await Promise.all([ing.from('documentos').select('id,data').eq('coleccion','proyectos'), ing.from('documentos').select('id,data').eq('coleccion','solicitudes')]);
    var k=pryClave(S.cod);
    var pry=(r[0].data||[]).map(function(x){ return Object.assign({id:x.id},x.data); }).find(function(p){ return k && pryClave(p.pry)===k; });
    if(pry) (r[1].data||[]).forEach(function(x){ var s=x.data||{}; if(s.proyectoId!==pry.id || s.estado==='Anulado') return;
      var fs=Array.isArray(s.archivos)?s.archivos:[]; if(!fs.length) return;
      var f=fs[fs.length-1]; if(!f.path) return;
      planos.push({ id:x.id, nombre:(s.codPlano?s.codPlano+' · ':'')+(s.plano||'Plano'), esp:s.especialidad||'', estado:s.estado||'', path:f.path, archivo:f.nombre||'plano' });
    });
  }catch(e){ toast('No se pudo leer Seguimiento de Planos',true); return; }
  var ya=(S.cur.adjuntos||[]).map(function(d){ return nn(d.descripcion); });
  var box=document.createElement('div');
  box.style.cssText='position:fixed;inset:0;background:rgba(11,18,38,.45);display:flex;align-items:center;justify-content:center;z-index:40;padding:16px';
  box.innerHTML='<div class="card" style="width:600px;max-width:100%;max-height:86vh;display:flex;flex-direction:column;margin:0"><h3>Planos de Ingeniería</h3><div class="hint">Planos de esta obra con archivo. Los aprobados van primero. Se copian al expediente de la licitación.</div>'+
    '<div class="lista" style="flex:1;max-height:none">'+(planos.length? planos.sort(function(a,b){ return (b.estado==='Aprobado')-(a.estado==='Aprobado'); }).map(function(p,i){
      var dup=ya.indexOf(nn('Plano de Ingeniería: '+p.nombre))>=0;
      return '<label class="sug'+(dup?' off':'')+'"><input type="checkbox" data-pl="'+i+'"'+(dup?' disabled':'')+'><div style="flex:1"><b>'+esc(p.nombre)+'</b><div class="e">'+esc(p.esp)+(dup?' · ya adjunto':'')+'</div></div><span class="pill '+(p.estado==='Aprobado'?'p-ok':'p-apr')+'">'+esc(p.estado==='Completado'?'Por aprobar':p.estado)+'</span></label>'; }).join('')
      : '<div class="empty" style="border:0">Ingeniería no tiene planos con archivo para esta obra.</div>')+'</div>'+
    '<div style="display:flex;gap:8px;justify-content:flex-end;margin-top:10px"><button class="btn" id="pc">Cancelar</button><button class="btn pri" id="po">Adjuntar</button></div></div>';
  document.body.appendChild(box);
  box.querySelector('#pc').onclick=function(){ box.remove(); };
  box.querySelector('#po').onclick=async function(){
    var sel=[].slice.call(box.querySelectorAll('[data-pl]:checked')).map(function(cb){ return planos[Number(cb.dataset.pl)]; });
    if(!sel.length){ box.remove(); return; }
    var b=box.querySelector('#po'); b.disabled=true; var ok=0;
    for(var i=0;i<sel.length;i++){
      var p=sel[i], ticket=null; b.textContent='Copiando '+(i+1)+' de '+sel.length+'…';
      try{
        var su=await ing.storage.from('entregables').createSignedUrl(p.path,600); if(su.error) throw su.error;
        var blob=await (await fetch(su.data.signedUrl)).blob();
        ticket=await api('subir',{ id:S.cur.id, nombre:p.archivo, tipo:'Plano', descripcion:'Plano de Ingeniería: '+p.nombre, bytes:blob.size });
        var up=await pmo.storage.from('lic-expediente').uploadToSignedUrl(ticket.path, ticket.token, blob, { contentType:blob.type||undefined });
        if(up.error) throw up.error;
        S.cur.adjuntos=(S.cur.adjuntos||[]).concat([{ id:ticket.doc_id, carpeta:'Plano', nombre:p.archivo, descripcion:'Plano de Ingeniería: '+p.nombre, path:ticket.path }]); ok++;
      }catch(e){ if(ticket&&ticket.doc_id){ try{ await api('quitar_adjunto',{doc_id:ticket.doc_id}); }catch(x){} } toast('No se pudo copiar '+p.nombre+': '+(e.message||e),true); }
    }
    box.remove(); pintarEditor(); if(ok) toast(ok+' plano'+(ok===1?'':'s')+' adjuntado'+(ok===1?'':'s'));
  };
}
async function elegirSugeridos(){
  leerForm();
  if(!S.cuentas){ try{ var r=await ct.rpc('contratistas_para_licitar'); S.cuentas=r.data||[]; }catch(e){ S.cuentas=[]; } }
  var h=await historialContratas();
  var ya=(S.cur.invitados||[]).map(function(v){ return nn(v.email); });
  var lista=S.cuentas.filter(function(c){ return ya.indexOf(nn(c.email))<0; });
  lista.forEach(function(c){ c._p=puntuar(c,h); });
  lista.sort(function(a,b){ return (b._p.n-a._p.n) || ((b._p.nota||0)-(a._p.nota||0)) || String(a.empresa).localeCompare(String(b.empresa)); });
  var box=document.createElement('div');
  box.style.cssText='position:fixed;inset:0;background:rgba(11,18,38,.45);display:flex;align-items:center;justify-content:center;z-index:40;padding:16px';
  box.innerHTML='<div class="card" style="width:560px;max-width:100%;max-height:86vh;display:flex;flex-direction:column;margin:0"><h3>Invitar contratistas</h3><div class="hint">Primero, quienes ya hicieron esta especialidad en otras obras. Empresas con cuenta en el portal.</div>'+
    '<input id="sq" placeholder="Buscar empresa o correo" style="border:1px solid var(--bd);border-radius:9px;padding:9px 11px;font-family:inherit;margin-bottom:8px">'+
    '<div id="sl" class="lista" style="flex:1;max-height:none"></div><div style="display:flex;gap:8px;justify-content:flex-end;margin-top:10px"><button class="btn" id="sc">Cancelar</button><button class="btn pri" id="so">Agregar</button></div></div>';
  document.body.appendChild(box);
  var marc={};
  function pinta(q){ q=nn(q); box.querySelector('#sl').innerHTML=lista.filter(function(c){ return !q || nn(c.empresa+' '+c.email).indexOf(q)>=0; }).map(function(c){ return '<label class="sug"><input type="checkbox" data-e="'+esc(c.email)+'"'+(marc[c.email]?' checked':'')+'><div style="flex:1"><b>'+esc(c.empresa)+'</b><div class="e">'+esc(c.email)+'</div>'+((c._p.n||c._p.nota!=null)?'<div class="reco">'+(c._p.n?'★ Hizo '+esc(c._p.esp.join(', '))+' en '+c._p.n+' obra'+(c._p.n===1?'':'s'):'')+(c._p.n&&c._p.nota!=null?' · ':'')+(c._p.nota!=null?'Evaluación '+c._p.nota+'/100':'')+'</div>':'')+'</div><span class="pill '+(c.homologacion_estado==='Homologado'?'p-ok':'p-borr')+'">'+esc(c.homologacion_estado||'Pendiente')+'</span></label>'; }).join('')||'<div class="empty" style="border:0">Nadie coincide.</div>'; }
  pinta('');
  box.querySelector('#sl').addEventListener('change',function(e){ var cb=e.target.closest('[data-e]'); if(cb) marc[cb.dataset.e]=cb.checked; });
  box.querySelector('#sq').oninput=function(){ pinta(this.value); };
  box.querySelector('#sc').onclick=function(){ box.remove(); };
  box.querySelector('#so').onclick=function(){ lista.forEach(function(c){ if(marc[c.email]) S.cur.invitados.push({ contratista:c.empresa, email:c.email, estado:'Invitado' }); }); box.remove(); pintarEditor(); toast('Guarda el borrador para conservar los invitados'); };
}

boot();
})();
